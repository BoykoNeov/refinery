# M12.1 demo plant: `crude_column_cascade.toml` with ONE key changed.
#
# The pair is meant to be diffed, exactly as `crude_column.toml` and
# `crude_column_cascade.toml` are (docs/DESIGN.md §5, §14 fork 9). Same crude,
# same furnace, same column, same three tanks at the same three rates — and the
# only line that differs below is
#
#     [fidelity] boiloff = "none"   ->   boiloff = "flash"
#
# (plus the plant's own name, which must differ because the corpus matches
# baseline rows by name).
#
# WHAT THE KEY SAYS. A cascade column draws at real tray temperatures, and the
# naphtha draw arrives at 387.6 K into a tank whose contents boil at ~354 K. The
# two models disagree about what that means:
#
#   boiloff = "none"    a product tank is a liquid store. It never boils, however
#                       hot the column runs. Wrong, and wrong conservatively: it
#                       moves no mass and invents no stream.
#   boiloff = "flash"   the superheat vaporises, the tank parks on its bubble
#                       point, and the vapour leaves at y = K·x through a vent to
#                       `Atmosphere` with NOTHING DOWNSTREAM OF IT. Also wrong —
#                       a real unit condenses that vapour and recovers it, which
#                       is `docs/DEFERRED.md` B12 and B13.
#
# Neither is a refinement of the other, which is why this is a fidelity key and
# not a bug fix with a flag on it.
#
# WHAT IT COSTS THE PLANT. The naphtha tank reaches its bubble point during the
# run and then vents about a quarter of its own draw as vapour, so this file's
# naphtha inventory, temperature and composition all part company with its
# twin's. The tank also gets HEAVIER in the process: the vapour is enriched in
# light naphtha, so what stays behind is not what arrived. A model that merely
# decremented the tank's mass would conserve mass just as exactly and would never
# move that composition — which is the one thing this plant exists to show.
#
# THE VENT IS NOT DECLARED HERE. The loader builds one vent edge per tank, plus
# the atmosphere node they lead to, whenever the selected model can boil
# (`build_boiloff_vents`). That is what keeps the diff against the twin one line
# long, and it is the `leak_to` precedent: a path to the outside world is graph
# surgery performed at load, never mid-run.

[meta]
name = "crude_column_boiloff"
description = "The crude_column_cascade plant with boiling product tanks: boiloff = \"flash\"."

[simulation]
dt = 0.1

[fidelity]
flow = "newton"
thermo = "trouton"
separation = "cascade"
reactions = "none"
boiloff = "flash"

[[components]]
name = "light_naphtha"
tb_c = 80.0
molar_mass_kg_per_mol = 0.100
density_kg_per_m3 = 680.0
cp_j_per_kg_k = 2200.0

[[components]]
name = "heavy_naphtha"
tb_c = 150.0
molar_mass_kg_per_mol = 0.130
density_kg_per_m3 = 750.0
cp_j_per_kg_k = 2100.0

[[components]]
name = "kerosene"
tb_c = 220.0
molar_mass_kg_per_mol = 0.170
density_kg_per_m3 = 800.0
cp_j_per_kg_k = 2050.0

[[components]]
name = "diesel"
tb_c = 300.0
molar_mass_kg_per_mol = 0.220
density_kg_per_m3 = 850.0
cp_j_per_kg_k = 2000.0

[[components]]
name = "residue"
tb_c = 400.0
molar_mass_kg_per_mol = 0.400
density_kg_per_m3 = 950.0
cp_j_per_kg_k = 1900.0

[nodes.crude_source]
type = "source"
pressure_bar = 6.0
temperature_c = 146.5
composition = { light_naphtha = 0.12, heavy_naphtha = 0.18, kerosene = 0.25, diesel = 0.25, residue = 0.20 }

[nodes.preheater]
type = "furnace"
duty_mw = 2.2607
# Fired, not absorbed (docs/DESIGN.md §40): the coil absorbs the 2.1051 MW the
# feed's trim to saturation needs, which at its 0.9312 efficiency is 2.2607 MW
# released by the burners. The coil keeps the 2.105 MW metal it was sized on.
# Tube coil (docs/DESIGN.md §37): 1 MJ/K per rated MW (its 2.105 MW); UA twice
# the load flow's 392.02 kW/K capacity rate; and the coil's steady temperature
# at load, the root of Q·(T_f − T_c)/(T_f − T_a) = G·(T_c − T_in)
# (§40 fork 5; Q = 2260.7 kW, G = 0.8647·392.02 kW/K, T_in = 146.68 °C), so the plant starts settled.
coil_heat_capacity_mj_per_k = 2.105
coil_ua_kw_per_k = 784
coil_temperature_c = 152.89
# Flame (docs/DESIGN.md §40): methane in air at the stoichiometric ratio,
# 2224.25 K (Marzouk 2023, doi:10.48084/etasr.6132). The duty is what the
# burners release; the coil absorbs (T_f − T_c)/(T_f − 20 °C) of it, 0.931 at load,
# and the rest goes up the stack.
flame_temperature_c = 1951.1
# Tubes (docs/DESIGN.md §42): past `tube_failure_c` the coil bursts, opening a
# hole of `tube_rupture_area_cm2` in the outlet pipe; while burst, what leaks
# burns in the firebox at `fluid_heating_value_mj_per_kg`. The limit and the
# hole are ROUND GAME-TUNING VALUES, not a cited metal limit: 550 °C, far above
# anything this coil reaches in service; a 1 cm² hole. The heating value is
# 42.686 MJ/kg, the lower heating value of crude oil, GREET 1.8d.1 (Argonne).
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.686

[nodes.column]
type = "column"
pressure_bar = 1.6
draws = [
    { outlet = "naphtha_tank", stage = 0, draw_ratio = 0.246 },
    { outlet = "distillate_tank", stage = 5, draw_ratio = 0.554 },
    { outlet = "bottoms_tank", stage = 8 },
]

[nodes.column.cascade]
stages = 8
feed_stage = 4
reflux_ratio = 2.0

[nodes.naphtha_tank]
type = "tank"
area_m2 = 8.0
height_m = 12.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { light_naphtha = 1.0 }

[nodes.distillate_tank]
type = "tank"
area_m2 = 8.0
height_m = 12.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { kerosene = 1.0 }

[nodes.bottoms_tank]
type = "tank"
area_m2 = 8.0
height_m = 12.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { residue = 1.0 }

[[pipes]]
name = "crude_line"
from = "crude_source"
to = "preheater"
length_m = 30.0
diameter_m = 0.15

[[pipes]]
name = "hot_feed_line"
from = "preheater"
to = "column"
length_m = 15.0
diameter_m = 0.15

[[pipes]]
name = "naphtha_draw"
from = "column"
to = "naphtha_tank"
length_m = 20.0
diameter_m = 0.10

[[pipes]]
name = "distillate_draw"
from = "column"
to = "distillate_tank"
length_m = 20.0
diameter_m = 0.10

[[pipes]]
name = "bottoms_draw"
from = "column"
to = "bottoms_tank"
length_m = 20.0
diameter_m = 0.12
