# M75.4 plant: an overfull column's knock-on effects (docs/DESIGN.md §80,
# ledger row C30).
#
# `crude_unit_holdup.toml` (untouched) — the tray plant holding liquid on its
# trays, in a reflux drum (18.7 m³) and a base (115.4 m³), its reboiler held
# (scheme B, §79.1) — with the three things M75 gave a column, each tested on
# inline fixtures of exactly this plant first:
#
# - ITS STEEL a heat store (M74.5, `steel = "derived"`): the column's shell
#   and trays, so its pressure rises at the pace its metal allows.
# - THE CONDENSER A LIMIT (M75.1, §80.2): sized on its first tick from the
#   duty it settled on with 5 % to spare, cooled by 35 °C water, 100 m³ of
#   overhead. It holds the set 1.8 bar (the flooded condenser, Kister §17.2.2)
#   until it cannot condense what arrives; then the column's pressure rises,
#   solved within each tick, up to its design pressure, 3.52 bar.
# - THE DRUM'S DRAIN AN OPERATOR'S (M75.2, §80.3): open, a drum past full
#   sends its excess to slop as since M74.6; shut (`SetSlopDrain`), the drum
#   holds it and backs up into the condenser's tubes, which condense less.
# - A RELIEF VALVE ON THE COLUMN'S TOP (M75.3, §80.4–§80.6), on the map with
#   its line to the flare (Kister §9.5, Fig. 9.3). Set at the design pressure,
#   3.52 bar; full lift 10 % of it (gauge) above, 3.77 bar (API RP-520, as
#   Ludwig Vol. 1B Fig. 9.7A states it); past full lift the column is held at
#   121 % of it, 4.05 bar, with an alarm. Opens gradually, never pops (C32).
#   SIZED BY THE BOOK RULE (Kister §9.3: loss of coolant governs, the whole
#   incoming vapour), Kv 5 000 — the M75.3.0 probe's figure (§80.4), the
#   larger of the two put to the user (their decision, 2026-11-14). WHERE IT
#   COMES FROM, stated plainly: the probe took the top's vapour as ~1 208
#   mol/s (137 kg/s) at its sizing tick's ~505 K; the same rule on the vapour
#   the tests read at rest (982 mol/s, 437 K) gives ~4 000 (§80.5). The hotter
#   temperature accounts for only ~4 000 → ~4 300; most of the gap is the
#   larger vapour reading, which is not yet explained (§80.7). Either size
#   holds the coolant lost below full lift: 3.65 bar at most here, 3.67 on
#   ~4 000. About seven API "T" orifices. Its line's back pressure is not
#   built (C34).
#
# The column screen's key 9 plays it, with the drain on a key.

[meta]
name = "crude_unit_overfill"
description = "The holding tray plant with a condenser that can run out, an operator's drain on its reflux drum and a relief valve on its top piped to a flare: an overfull drum backs up into the condenser and the column's pressure rises to relief."

[simulation]
dt = 0.1

[[components]]
name = "light_naphtha"
tb_c = 70.0
molar_mass_kg_per_mol = 0.095
density_kg_per_m3 = 680.0
cp_j_per_kg_k = 2200.0

[[components]]
name = "heavy_naphtha"
tb_c = 150.0
molar_mass_kg_per_mol = 0.13
density_kg_per_m3 = 750.0
cp_j_per_kg_k = 2100.0

[[components]]
name = "kerosene"
tb_c = 220.0
molar_mass_kg_per_mol = 0.17
density_kg_per_m3 = 800.0
cp_j_per_kg_k = 2050.0

[[components]]
name = "diesel"
tb_c = 300.0
molar_mass_kg_per_mol = 0.22
density_kg_per_m3 = 850.0
cp_j_per_kg_k = 2000.0

[[components]]
name = "gas_oil"
tb_c = 380.0
molar_mass_kg_per_mol = 0.3
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 1950.0

[[components]]
name = "residue"
tb_c = 560.0
molar_mass_kg_per_mol = 0.55
density_kg_per_m3 = 980.0
cp_j_per_kg_k = 1850.0

[fidelity]
flow = "newton"
thermo = "trouton"
separation = "heat_balance"
reactions = "none"
boiloff = "none"

[nodes.crude_source]
type = "source"
pressure_bar = 30.0
temperature_c = 270.0
composition = { light_naphtha = 0.08, heavy_naphtha = 0.14, kerosene = 0.16, diesel = 0.20, gas_oil = 0.14, residue = 0.28 }

[nodes.furnace]
type = "furnace"
duty_mw = 20.0
coil_heat_capacity_mj_per_k = 45.0
coil_ua_kw_per_k = 600
coil_temperature_c = 359.5
flame_temperature_c = 1951.1
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.686

[nodes.column]
type = "column"
pressure_bar = 1.8
draws = [
    { outlet = "naphtha_tank", stage = 0, draw_ratio = 0.22 },
    { outlet = "kerosene_tank", stage = 4, draw_ratio = 0.16 },
    { outlet = "diesel_tank", stage = 7, draw_ratio = 0.2 },
    { outlet = "gas_oil_tank", stage = 10, draw_ratio = 0.14 },
    { outlet = "residue_tank", stage = 13 },
]

[nodes.column.cascade]
stages = 13
feed_stage = 11
reflux_ratio = 4.0
holdup = { drum_m3 = 18.7, base_m3 = 115.4, reboiler = "held", steel = "derived" }
condenser_limit = { margin = 0.05, coolant_c = 35.0, overhead_m3 = 100.0, relief = { valve = "column_psv" } }
trays = [
    { from = 1, to = 2, diameter_m = 5.9, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.10, downcomer_share = 0.18, clearance_m = 0.045, passes = 4 },
    { from = 3, to = 5, diameter_m = 7.3, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.15, downcomer_share = 0.22, clearance_m = 0.045, passes = 4 },
    { from = 6, to = 8, diameter_m = 8.4, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.15, downcomer_share = 0.24, clearance_m = 0.045, passes = 4 },
    { from = 9, to = 10, diameter_m = 8.5, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.12, downcomer_share = 0.18, clearance_m = 0.045, passes = 4 },
    { from = 11, to = 11, diameter_m = 7.0, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.12, downcomer_share = 0.18, clearance_m = 0.045, passes = 4 },
    { from = 12, to = 12, diameter_m = 8.5, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.15, downcomer_share = 0.28, clearance_m = 0.045, passes = 4 },
]
loops = [
    { draw_stage = 4, return_stage = 3, outlet = "kero_pa_pump", flow_kg_per_s = 85.0, return_temperature_c = 150.0, cooler_capacity_mw = 30.0, start_duty_mw = 15.0 },
    { draw_stage = 7, return_stage = 6, outlet = "diesel_pa_pump", flow_kg_per_s = 95.0, return_temperature_c = 215.0, cooler_capacity_mw = 30.0, start_duty_mw = 15.0 },
    { draw_stage = 10, return_stage = 9, outlet = "gas_oil_pa_pump", flow_kg_per_s = 65.0, return_temperature_c = 270.0, cooler_capacity_mw = 30.0, start_duty_mw = 10.0 },
]

[nodes.naphtha_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { light_naphtha = 1.0 }

[nodes.kerosene_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { kerosene = 1.0 }

[nodes.diesel_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { diesel = 1.0 }

[nodes.gas_oil_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { gas_oil = 1.0 }

[nodes.residue_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { residue = 1.0 }

[nodes.kero_pa_pump]
type = "pump"
h0_m = 60.0
a = 1000.0
on = true

[nodes.kero_pa_cooler]
type = "cooler"
duty_mw = 0.0

[nodes.diesel_pa_pump]
type = "pump"
h0_m = 60.0
a = 1000.0
on = true

[nodes.diesel_pa_cooler]
type = "cooler"
duty_mw = 0.0

[nodes.gas_oil_pa_pump]
type = "pump"
h0_m = 60.0
a = 1000.0
on = true

[nodes.gas_oil_pa_cooler]
type = "cooler"
duty_mw = 0.0

# The column's safety valve, on its top before the condenser (Kister §9.5):
# set at the column's design pressure, full lift 10 % of it gauge above
# (API RP-520), Kv 5 000 by the book rule (the M75.3.0 probe's figure, above).
[nodes.column_psv]
type = "relief_valve"
kv = 5000.0
set_pressure_bar = 3.52
accumulation_bar = 0.250675
x_t = 0.7

# The flare, at atmosphere.
[nodes.flare]
type = "sink"
pressure_bar = 1.01325
composition = { light_naphtha = 1.0 }

[[pipes]]
name = "crude_line"
from = "crude_source"
to = "furnace"
length_m = 30.0
diameter_m = 0.08

[[pipes]]
name = "transfer_line"
from = "furnace"
to = "column"
length_m = 15.0
diameter_m = 0.08

[[pipes]]
name = "naphtha_draw"
from = "column"
to = "naphtha_tank"
length_m = 20.0
diameter_m = 0.15

[[pipes]]
name = "kerosene_draw"
from = "column"
to = "kerosene_tank"
length_m = 20.0
diameter_m = 0.15

[[pipes]]
name = "diesel_draw"
from = "column"
to = "diesel_tank"
length_m = 20.0
diameter_m = 0.15

[[pipes]]
name = "gas_oil_draw"
from = "column"
to = "gas_oil_tank"
length_m = 20.0
diameter_m = 0.15

[[pipes]]
name = "residue_draw"
from = "column"
to = "residue_tank"
length_m = 20.0
diameter_m = 0.15

[[pipes]]
name = "kero_pa_suction"
from = "column"
to = "kero_pa_pump"
length_m = 20.0
diameter_m = 0.3
elevation_change_m = -15.0

[[pipes]]
name = "kero_pa_discharge"
from = "kero_pa_pump"
to = "kero_pa_cooler"
length_m = 30.0
diameter_m = 0.3

[[pipes]]
name = "kero_pa_return"
from = "kero_pa_cooler"
to = "column"
length_m = 30.0
diameter_m = 0.3
elevation_change_m = 15.6

[[pipes]]
name = "diesel_pa_suction"
from = "column"
to = "diesel_pa_pump"
length_m = 20.0
diameter_m = 0.3
elevation_change_m = -15.0

[[pipes]]
name = "diesel_pa_discharge"
from = "diesel_pa_pump"
to = "diesel_pa_cooler"
length_m = 30.0
diameter_m = 0.3

[[pipes]]
name = "diesel_pa_return"
from = "diesel_pa_cooler"
to = "column"
length_m = 30.0
diameter_m = 0.3
elevation_change_m = 15.6

[[pipes]]
name = "gas_oil_pa_suction"
from = "column"
to = "gas_oil_pa_pump"
length_m = 20.0
diameter_m = 0.3
elevation_change_m = -15.0

[[pipes]]
name = "gas_oil_pa_discharge"
from = "gas_oil_pa_pump"
to = "gas_oil_pa_cooler"
length_m = 30.0
diameter_m = 0.3

[[pipes]]
name = "gas_oil_pa_return"
from = "gas_oil_pa_cooler"
to = "column"
length_m = 30.0
diameter_m = 0.3
elevation_change_m = 15.6

[[pipes]]
name = "relief_inlet"
from = "column"
to = "column_psv"
length_m = 3.0
diameter_m = 0.9

[[pipes]]
name = "flare_header"
from = "column_psv"
to = "flare"
length_m = 80.0
diameter_m = 1.2
