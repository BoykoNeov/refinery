# M62.5 demo plant: the boiling crude unit with water in its crude
# (docs/DESIGN.md §67.17).
#
# `crude_unit_boiling.toml` (M62.4) with a slate member for water — one boiling
# component, free water that never dissolves in the oil — and a crude that is
# 0.3 % water by mass, a desalted crude's:
#
# - THE COIL boils the water off with the crude's lightest cuts as the pressure
#   falls along it; the transfer line carries it into the column as vapour.
# - THE COLUMN carries its water as a balance of its own: it rises from the
#   feed tray as vapour (every tray hotter than water's dew point at its share
#   of the vapour), the oil boiling at its own partial pressure; the total
#   condenser condenses both at their wet bubble point, and the water settles
#   out of the reflux drum and leaves by its own draw. The reflux and the
#   naphtha are oil.
# - THE WATER DRAW runs down to a sour-water tank.
# - THE CHARGE is less than the dry plant's: the water boils already at the
#   270 °C, 30 bar supply (water cannot stand liquid there below ~55 bar), so
#   the control valve and the coil pass a two-phase stream — about 113 kg/s
#   against 134. The coil's metal starts where this plant settles it, 322.05 °C.
#
# What it still does not have: steam into the column (M62.6) and steam
# stripping (M63) — the column keeps its reboiler.
#
# Generated by `tools/steptime/prototypes/m62_5/make_wet.py` from
# `crude_unit_boiling.toml`.

[meta]
name = "crude_unit_wet"
description = "The boiling crude unit with water in its crude: the water boils off in the coil, rides up the column as vapour and is decanted at its condenser to a sour-water tank."

[simulation]
dt = 0.1

[[components]]
name = "light_naphtha"
tb_c = 70.0
molar_mass_kg_per_mol = 0.095
density_kg_per_m3 = 680.0
cp_j_per_kg_k = 2200.0

[[components]]
name = "heavy_naphtha"
tb_c = 150.0
molar_mass_kg_per_mol = 0.13
density_kg_per_m3 = 750.0
cp_j_per_kg_k = 2100.0

[[components]]
name = "kerosene"
tb_c = 220.0
molar_mass_kg_per_mol = 0.17
density_kg_per_m3 = 800.0
cp_j_per_kg_k = 2050.0

[[components]]
name = "diesel"
tb_c = 300.0
molar_mass_kg_per_mol = 0.22
density_kg_per_m3 = 850.0
cp_j_per_kg_k = 2000.0

[[components]]
name = "gas_oil"
tb_c = 380.0
molar_mass_kg_per_mol = 0.3
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 1950.0

[[components]]
name = "residue"
tb_c = 560.0
molar_mass_kg_per_mol = 0.55
density_kg_per_m3 = 980.0
cp_j_per_kg_k = 1850.0

[[components]]
name = "water"
tb_c = 100.0
molar_mass_kg_per_mol = 0.018015
density_kg_per_m3 = 998.0
cp_j_per_kg_k = 4184.0
dh_vap_j_per_mol = 40650.0
cp_vapour_j_per_kg_k = 2000.0
free_water = true

[fidelity]
flow = "newton"
thermo = "trouton"
separation = "heat_balance"
reactions = "none"
boiloff = "flash"
line_flash = "equilibrium"

[nodes.crude_source]
type = "source"
pressure_bar = 30.0
temperature_c = 270.0
composition = { light_naphtha = 0.07976, heavy_naphtha = 0.13958, kerosene = 0.15952, diesel = 0.1994, gas_oil = 0.13958, residue = 0.27916, water = 0.003 }

[nodes.feed_valve]
type = "valve"
kv = 135.0
opening = 1.0

[nodes.furnace]
type = "furnace"
duty_mw = 20.0
coil_heat_capacity_mj_per_k = 45.0
coil_ua_kw_per_k = 600
coil_temperature_c = 322.05
flame_temperature_c = 1951.1
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.686
coil_cells = 8
coil_length_m = 800.0
coil_diameter_m = 0.24

[nodes.column]
type = "column"
pressure_bar = 1.8
draws = [
    { outlet = "naphtha_pump", stage = 0, draw_ratio = 0.22 },
    { outlet = "sour_water_tank", stage = 0, phase = "water" },
    { outlet = "kerosene_pump", stage = 3, draw_ratio = 0.16 },
    { outlet = "diesel_pump", stage = 5, draw_ratio = 0.2 },
    { outlet = "gas_oil_pump", stage = 7, draw_ratio = 0.14 },
    { outlet = "residue_pump", stage = 10 },
]

[nodes.column.cascade]
stages = 10
feed_stage = 8
reflux_ratio = 4.0
pumparounds = [{ stage = 4, duty_mw = 15.0 }, { stage = 6, duty_mw = 15.0 }, { stage = 7, duty_mw = 10.0 }]

[nodes.sour_water_tank]
type = "tank"
area_m2 = 10.0
height_m = 10.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { water = 1.0 }

[nodes.naphtha_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { light_naphtha = 1.0 }

[nodes.kerosene_tank]
