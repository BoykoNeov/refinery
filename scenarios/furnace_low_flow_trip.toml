# M33 protection demo: a furnace fired by hand on a feed that fades, and a trip
# that cuts its fuel when the flow through it gets too low.
#
#   charge_tank (by gravity) -> feed_valve -> heater (0.6 MW) -> product
#
# **Why a low-flow trip exists.** A furnace's settled outlet is its inlet plus
# `Q_abs/(ṁ·cp)`, the share of its duty the tubes absorb over the stream's
# capacity rate. Fired at a fixed duty on a falling flow, the outlet climbs as the
# flow falls, and with no flow the tubes keep everything they absorb, climbing at
# up to `Q/C` (1 K/s here) toward the flame for as long as the fire stays lit (the
# coil, docs/DESIGN.md §37, and its flame, §40); on a real heater the tubes burn
# out long before. The trip
# watches the FEED, not the outlet: the flow is what fails, and an outlet trip is
# still deferred (docs/DEFERRED.md E13).
#
# **What drives the flow down here.** Nothing but the plant: the charge tank
# drains by gravity through a fully open valve, so its head, and the feed with
# it, falls from 4.89 kg/s on tick 1 to 2.0 kg/s near tick 3 016 and to zero when
# the tank runs dry. No command is issued; the CLI issues none.
#
# **The rule for the missing measurement** (§36 fork 1). A pipe's flow is read
# from the last hydraulic solve, and before tick 1 there is none. The trip stays
# armed and compares nothing on tick 1's pass — its snapshot carries no
# `measurement` — and compares on every tick from 2. A flow is absent for that
# one pass only: from tick 2 every flow is a measurement, zero included.
#
# **What the trip does, measured on both fidelities** (§36). The feed ends tick
# 3 016 at 1.99951 kg/s, so the pass at the top of tick 3 017 fires and the
# furnace reads zero duty on that tick's own snapshot. Until then the plant is
# bit for bit its own untripped twin. From the cut on the furnace adds no heat of
# its own; its coil, at 87.7 °C when the fuel goes, warms the feed while it cools,
# and the fluid gains exactly what the coil loses: 87.18 °C at the end of 3 016,
# 86.73 °C at the end of 3 017, 20.003 °C by 4 000. (Before M34 the outlet fell to
# the feed's temperature on the cutting tick itself; before M36 every watt fired
# reached the tubes, and the outlet read 89.09 °C on the cutting tick.)
#
# **The cut moves no flow.** At constant density nothing hydraulic reads a
# furnace's duty, so the feed keeps fading exactly as the twin's does, every flow
# equal to the bit to tick 6 000. The condition therefore never clears on this
# plant, and a reset is refused all the way down. The LATCH is shown on a fixture
# whose feed can be restored, in `crates/scenarios/tests/flow_trip_reference.rs`.
#
# **What happens without it.** Delete the `[[trips]]` block and the furnace keeps
# firing on the trickle: its outlet passes 100 °C at tick 3 385, reads 136.3 °C at
# 4 000 and 368 °C at 5 000, and once the tank is dry and the flow exactly zero
# (tick 5 238 on Newton) the coil keeps all it absorbs, 1 000.5 °C by 6 000 on
# both fidelities and still rising, toward its 1 951 °C flame (§40; before M36 it
# climbed at 1 K/s without limit, to about 1 405 °C). The tubes would fail long
# before either: a burn-out is not modelled yet (docs/DEFERRED.md B40).
#
# **What this file cannot show.** The CLI issues no commands, so the refused
# relight, the reset, and the cold start the latch makes a start permissive are
# exercised by the fixtures in `flow_trip_reference.rs`.
#
#   cargo run -p refinery-cli -- run scenarios/furnace_low_flow_trip.toml --ticks 6000

[meta]
name = "furnace_low_flow_trip"
description = "A furnace fired by hand on a feed that fades as its tank empties; a latching low-flow trip cuts the fuel."

[simulation]
dt = 1.0

[fidelity]
flow = "newton"     # "newton" (research) | "simple" (game)
thermo = "constant"
reactions = "none"

# 12.5 t of water at 10 m: the plant's only supply. Nothing refills it.
[nodes.charge_tank]
type = "tank"
area_m2 = 1.25
height_m = 12.0
initial_level_m = 10.0
temperature_c = 20.0

# Fully open and never moved. Its Kv is what sets the feed: 4.89 kg/s at the full
# 10 m of head, falling with the head as the tank drains.
[nodes.feed_valve]
type = "valve"
kv = 18.0
opening = 1.0

# Fired by hand at 0.6 MW and left there: 29 K on the starting feed, 72 K at the
# 2 kg/s the trip is set to.
[nodes.heater]
type = "furnace"
duty_mw = 0.6
# Tube coil (docs/DESIGN.md §37): 1 MJ/K per rated MW (its 0.6 MW); UA twice
# the load flow's 20.46 kW/K capacity rate; and the coil's steady temperature
# at load, the root of Q·(T_f − T_c)/(T_f − T_a) = G·(T_c − T_in)
# (§40 fork 5; Q = 600 kW, G = 0.8645·20.46 kW/K, T_in = 20.02 °C), so the plant starts settled.
coil_heat_capacity_mj_per_k = 0.6
coil_ua_kw_per_k = 40.9
coil_temperature_c = 53.36
# Flame (docs/DESIGN.md §40): methane in air at the stoichiometric ratio,
# 2224.25 K (Marzouk 2023, doi:10.48084/etasr.6132). The duty is what the
# burners release; the coil absorbs (T_f − T_c)/(T_f − 20 °C) of it, 0.983 at load,
# and the rest goes up the stack.
flame_temperature_c = 1951.1
# Tubes (docs/DESIGN.md §42): past `tube_failure_c` the coil bursts, opening a
# hole of `tube_rupture_area_cm2` in the outlet pipe; while burst, what leaks
# burns in the firebox at `fluid_heating_value_mj_per_kg`. The limit and the
# hole are ROUND GAME-TUNING VALUES, not a cited metal limit: 550 °C, far above
# anything this coil reaches in service; a 1 cm² hole. The heating value is 0:
# water does not burn, so a hole leaks but lights nothing.
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 0.0

[nodes.product]
type = "sink"
pressure_bar = 1.01325

[[pipes]]
name = "feed_line"
from = "charge_tank"
to = "feed_valve"
length_m = 20.0
diameter_m = 0.10

[[pipes]]
name = "valve_line"
from = "feed_valve"
to = "heater"
length_m = 5.0
diameter_m = 0.10

[[pipes]]
name = "heated_line"
from = "heater"
to = "product"
length_m = 20.0
diameter_m = 0.10

# Fires AT OR BELOW 2 kg/s on the feed (docs/DESIGN.md §26 fork 6) and cuts the
# furnace's fuel. The flow is the last solve's, so on tick 1 there is none and
# the trip compares nothing (§36 fork 1); from tick 2 it compares every tick.
[[trips]]
name = "heater_low_flow"
measurement = { pipe = "feed_line", variable = "flow" }
direction = "low"
limit_kg_per_s = 2.0
actions = [{ furnace = "heater" }]
