# M10.1 regulation demo: the M5.4c receiver, held at a pressure by a control loop
# on a vent valve instead of by the spring inside a relief valve.
#
# **Meant to be diffed against `relief_blowdown.toml`**, exactly as
# `tank_level_control.toml` is meant to be diffed against `tank_pump_valve.toml`.
# The header, the receiver, the flare, the make-up line, the flare line and the
# tick length are that file's, number for number. The pair then says what
# regulation *is*: one plant is held by a spring, the other by a loop.
#
# | line | `relief_blowdown` | here | why |
# |---|---|---|---|
# | the relieving device | `psv`, a `relief_valve` set at 20 bar with a 1 bar accumulation band | `vent_valve`, an ordinary `valve` written by a PI loop | the milestone. A PSV is refused as an actuator by name — its opening is a memoryless function of its own inlet pressure, recomputed every solve, so a controller writing it would be overwritten inside the same tick |
# | the inlet line | `psv_inlet`, 5 m x 0.06 m | `vent_line`, 10 m x 0.05 m | sized on gas velocity, and the number is measured: at the settled state the vent passes 0.4987 kg/s of fuel gas at 12.214 kg/m3, which is **20.8 m/s** through 0.05 m — an ordinary gas-line velocity. See the note below on what this did NOT turn out to be about |
# | `[[controls]]` | absent | one loop | the first pressure loop in the project |
#
# **The settled state is the point of the plant, and it is interior.** The
# receiver starts at 12 bar, well below the 20 bar setpoint, so the run shows the
# build-up and the settle rather than starting at the answer — `relief_blowdown`'s
# own discipline. It parks at **20.000007 bar with the vent 0.558224 open**, and
# that mid-range position is a design input rather than an outcome to admire: a
# vent that had to sit nearly shut or nearly wide open would put the operating
# point next to a clamp, and M8.4's demo never left [0.194, 0.384], so its
# anti-windup arm was never reached by a wired run. Sizing for an interior
# operating point is what makes the saturation arms reachable from here by a
# command instead of unreachable in principle.
#
# **The loop actuates an OUTLET of the thing it measures, and that is forced.**
# The error is `measurement - setpoint` and the output is `clamp(K*e + b, 0, 1)`,
# so a rising measurement OPENS the actuator. M8.4 recorded this as "a level loop
# must actuate a drain"; read as a rule about levels it is too narrow. What the
# sign convention forces is that the actuator is an outlet of the measured
# holdup — a drain for a tank, a vent for a vessel. Throttling the make-up
# instead would be reverse acting; that is not expressible today (a negative gain
# is refused at load in both controllers, deliberately) and is deferred with its
# own trigger rather than smuggled in as a sign.
#
# **The setpoint and the gain are both in bar, and that pairing is load bearing.**
# Every pressure this format declares is in bar, so `setpoint_bar` follows the
# format rather than the `setpoint_pa` the schema once predicted. The controller's
# arithmetic is in Pascals, so the loader multiplies the setpoint by 1e5 and
# divides the gain by the same 1e5, at one site. Converting one without the other
# is a factor of 100 000 that nothing here would catch: the loop would still be
# stable, still converge and still conserve mass, merely tuned five orders of
# magnitude away. `scenarios/tests/pressure_control_demo.rs` measures the loop's
# first output against a hand-computed `K*e` for exactly that reason.
#
# **The gain has a bound on BOTH sides here, unlike the level demo's.** At the
# settled opening of 0.558224 a setpoint step of one bar moves the output by
# `gain_per_bar`: raising the setpoint subtracts it, so 0.5582 reaches 0, and
# lowering the setpoint adds it, so 0.4418 reaches 1. The level demo had only the
# lower bound, because its drain settled at 0.376 and its setpoint was only ever
# stepped up. The shipped 0.10 leaves a factor of four of margin either way, and
# both bounds are pinned by the demo test.
#
# **What the game fidelity costs here was measured, and it falsified the reason
# this file was expected to be cheap.** DESIGN §12 fork 5 argued the plant would
# avoid `relief_blowdown`'s 920 sweeps because a controlled vent CONDUCTS at
# steady state, so its valve node is not the dead end that deferral A3 is about.
# The vent does conduct — 0.4987 kg/s — and with the oversized 2 m x 0.10 m line
# this file was first drafted with, the game fidelity still took **741 sweeps**.
# Dead-endedness is not what drives it. What does is the vent line's conductance
# against the vessel's own capacitance term, which is the same mechanism
# `psv_inlet`'s comment describes and NOT the same shape: 2 m x 0.10 m costs 741
# sweeps, 5 m x 0.06 m costs 34, and the 10 m x 0.05 m shipped here costs 13.
# The geometry is chosen on velocity, above; this is the consequence, recorded
# rather than the reason.
#
# **No PSV on this plant, deliberately.** A normally-shut relief valve leaves its
# valve node a dead end, and a second plant of that shape would move deferral A3's
# measured distance as a side effect of a milestone about something else.
#
#   cargo run -p refinery-cli -- run scenarios/vessel_pressure_control.toml --ticks 6000

[meta]
name = "vessel_pressure_control"
description = "A gas receiver held at 20 bar by a PI loop on a vent valve to the flare."

[simulation]
dt = 0.1

[fidelity]
flow = "newton"     # "newton" (research) | "simple" (game)
thermo = "constant"
reactions = "none"

# The slate, the header, the receiver and the flare are `relief_blowdown`'s.
[[components]]
name = "fuel_gas"
phase = "gas"
tb_c = -161.5
molar_mass_kg_per_mol = 0.016043
cp_j_per_kg_k = 2220.0

[nodes.header]
type = "source"
pressure_bar = 30.0
temperature_c = 20.0

# The receiver, and the node the loop MEASURES. Its pressure is `m/C` with the
# mass on the graph, so it is a stored quantity and is real at tick 0 — the
# loader builds the initial mass as `12 bar x capacitance` through the same method
# `pressure` divides by, so the loop's measurement before the first tick is
# exactly the figure declared here. DESIGN §10 fork 3 said otherwise, and §12
# corrected it; a junction's pressure really is solved, and is refused.
[nodes.receiver]
type = "vessel"
volume_m3 = 2.0
pressure_bar = 12.0
temperature_c = 20.0

# The actuator. An ordinary valve, sized so that holding 20 bar needs it about
# half open. `x_t` is required because a gas-only slate puts every node in this
# plant in gas service — the loader refuses the file without it, and refuses it on
# a liquid valve — and carries the same secondary citation `gas_valve.toml`
# records: 0.72 for a globe valve, single-port, parabolic plug, flow-to-open,
# widely reproduced from IEC 60534-2-1 Table 2. This workspace has not read the
# standard. `opening` equals `initial_output` below, and that is the point.
[nodes.vent_valve]
type = "valve"
kv = 12.0
opening = 0.30
x_t = 0.72

[nodes.flare]
type = "sink"
pressure_bar = 1.1
temperature_c = 20.0

# Restrictive enough that the vent can overtake it with margin at any reachable
# pressure — if the make-up could outrun a wide-open vent, "interior at steady
# state" would be unreachable and no tuning would fix it.
[[pipes]]
name = "make_up"
from = "header"
to = "receiver"
length_m = 20.0
diameter_m = 0.021

# 20.8 m/s at the settled state. See the header table.
[[pipes]]
name = "vent_line"
from = "receiver"
to = "vent_valve"
length_m = 10.0
diameter_m = 0.05

[[pipes]]
name = "flare_line"
from = "vent_valve"
to = "flare"
length_m = 30.0
diameter_m = 0.10

# `initial_output` is the loop's MEMORY, not a bias (docs/DESIGN.md §10 fork 5):
# the integral term is back-calculated at load from it and the error standing
# there, so the first `update` returns exactly this number whatever the gain is.
# Declaring it equal to `vent_valve.opening` is what makes the loop start without
# stepping its own actuator.
#
# At `integral_time_s = 30` the pressure is inside 0.01 bar of setpoint from tick
# 1993 and stays there, and the vent never leaves [0.3000, 0.5882] — so this run,
# like M8.4's, does NOT reach either saturation arm. That gap is closed by
# command in the demo test rather than by mistuning the shipped file.
[[controls]]
name = "receiver_pressure"
measurement = { node = "receiver", variable = "pressure" }
actuator = "vent_valve"
algorithm = "pi"
mode = "auto"
setpoint_bar = 20.0
gain_per_bar = 0.10
integral_time_s = 30.0
initial_output = 0.30
