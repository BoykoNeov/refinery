# M86.5 demo plant: a stopped product pump CUTS its product to about half,
# and the column holding liquid keeps the rest (docs/DESIGN.md §84.5).
#
# Both M86.5 plants (docs/DESIGN.md §84.5) are `crude_unit_holdup.toml` — the
# thirteen-tray column holding liquid on its trays, in an 18.7 m3 reflux drum
# and a 115.4 m3 base, the distillate holding the drum's level and the
# bottoms the base's — with a product line on every draw: the draw falls 15 m
# to its pump, which pushes it through a check valve and a water cooler to its
# tank. The check valve keeps a tank from pushing its product back through a
# stopped pump (§84.3).
#
# A COLUMN THAT HOLDS LIQUID KEEPS WHAT A LINE CANNOT TAKE (§84.2), unlike the
# M86.4 plants' column, which holds none and sends it to the next draw down.
# What the naphtha line cannot take stays in the reflux drum, what the residue
# line cannot take in the base: the level rises, its level loop asks for more
# (at most 2.5 times), and past full the excess goes to slop, off-spec. What a
# side draw's line cannot take stays on its tray and runs down the column; on
# the hotter trays below its lighter part boils back up, so it leaves partly
# with the naphtha and partly with the residue, and trays it overloads read as
# flooding. Nothing halts: every pump may stop.
#
# A stopped centrifugal pump is not a closed valve: product still flows
# through it if something else pushes (Chaudhry 2014, Table A-1). What stops
# the product is what the line asks the pump to lift.
#
# HERE THE TANKS STAND AT GRADE, as in a refinery, 1.5 km away in the tank
# farm, entered 15 m up (the column's draws' level). Each pump has 100 m of
# head, the long rundown taking most of it. With the pump stopped, the
# column's 0.8 bar over the air outside still pushes product through the
# stopped pump, so the line carries 54-58 % of its product at first, a little
# less as the column moves (about a point every 10 minutes); running, 1.9-2.0
# times it. Measured, the newton solver, from the pump stopped:
#
# - naphtha: its flow to 0.56, 0.52 by 40 min; the drum barely moves (0.50 ->
#   0.54, back to 0.51 in 40 min): its loop sends the rest back as reflux,
#   and it leaves with the residue, up 36 % in 40 min.
# - kerosene, diesel or gas oil: its flow to 0.55-0.58; the naphtha up
#   3-12 %, the residue 13-25 %.
# - residue: its flow to 0.54, 0.47 by 70 min; the base 0.50 -> 0.56 in 5
#   min, full in 41, then 15 kg/s to slop while the line still carries 14.
#
# `crude_unit_holdup_pumps_lifted.toml` is the same plant with its tanks on
# high ground, where a stopped pump stops its product completely.
#
# Generated by `tools/steptime/prototypes/m86_5/make_holdup_pumped.py grade`.

[meta]
name = "crude_unit_holdup_pumps_grade"
description = "The holding tray plant with its product tanks at grade at the end of long rundowns: a stopped product pump cuts its product to about half and the column keeps the rest, so the base fills and spills to slop, or a side product's rest leaves with the naphtha and the residue."

[simulation]
dt = 0.1

[[components]]
name = "light_naphtha"
tb_c = 70.0
molar_mass_kg_per_mol = 0.095
density_kg_per_m3 = 680.0
cp_j_per_kg_k = 2200.0

[[components]]
name = "heavy_naphtha"
tb_c = 150.0
molar_mass_kg_per_mol = 0.13
density_kg_per_m3 = 750.0
cp_j_per_kg_k = 2100.0

[[components]]
name = "kerosene"
tb_c = 220.0
molar_mass_kg_per_mol = 0.17
density_kg_per_m3 = 800.0
cp_j_per_kg_k = 2050.0

[[components]]
name = "diesel"
tb_c = 300.0
molar_mass_kg_per_mol = 0.22
density_kg_per_m3 = 850.0
cp_j_per_kg_k = 2000.0

[[components]]
name = "gas_oil"
tb_c = 380.0
molar_mass_kg_per_mol = 0.3
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 1950.0

[[components]]
name = "residue"
tb_c = 560.0
molar_mass_kg_per_mol = 0.55
density_kg_per_m3 = 980.0
cp_j_per_kg_k = 1850.0

[fidelity]
flow = "newton"
thermo = "trouton"
separation = "heat_balance"
reactions = "none"
boiloff = "none"

[nodes.crude_source]
type = "source"
pressure_bar = 30.0
temperature_c = 270.0
composition = { light_naphtha = 0.08, heavy_naphtha = 0.14, kerosene = 0.16, diesel = 0.20, gas_oil = 0.14, residue = 0.28 }

[nodes.furnace]
type = "furnace"
duty_mw = 20.0
coil_heat_capacity_mj_per_k = 45.0
coil_ua_kw_per_k = 600
coil_temperature_c = 359.5
flame_temperature_c = 1951.1
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.686

[nodes.column]
type = "column"
pressure_bar = 1.8
draws = [
    { outlet = "naphtha_pump", stage = 0, draw_ratio = 0.22 },
    { outlet = "kerosene_pump", stage = 4, draw_ratio = 0.16 },
    { outlet = "diesel_pump", stage = 7, draw_ratio = 0.2 },
    { outlet = "gas_oil_pump", stage = 10, draw_ratio = 0.14 },
    { outlet = "residue_pump", stage = 13 },
]

[nodes.column.cascade]
stages = 13
feed_stage = 11
reflux_ratio = 4.0
holdup = { drum_m3 = 18.7, base_m3 = 115.4, reboiler = "held" }
trays = [
    { from = 1, to = 2, diameter_m = 5.9, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.10, downcomer_share = 0.18, clearance_m = 0.045, passes = 4 },
    { from = 3, to = 5, diameter_m = 7.3, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.15, downcomer_share = 0.22, clearance_m = 0.045, passes = 4 },
    { from = 6, to = 8, diameter_m = 8.4, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.15, downcomer_share = 0.24, clearance_m = 0.045, passes = 4 },
    { from = 9, to = 10, diameter_m = 8.5, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.12, downcomer_share = 0.18, clearance_m = 0.045, passes = 4 },
    { from = 11, to = 11, diameter_m = 7.0, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.12, downcomer_share = 0.18, clearance_m = 0.045, passes = 4 },
    { from = 12, to = 12, diameter_m = 8.5, spacing_m = 0.76, weir_height_m = 0.05, hole_diameter_m = 0.005, hole_area_share = 0.15, downcomer_share = 0.28, clearance_m = 0.045, passes = 4 },
]
loops = [
    { draw_stage = 4, return_stage = 3, outlet = "kero_pa_pump", flow_kg_per_s = 85.0, return_temperature_c = 150.0, cooler_capacity_mw = 30.0, start_duty_mw = 15.0 },
    { draw_stage = 7, return_stage = 6, outlet = "diesel_pa_pump", flow_kg_per_s = 95.0, return_temperature_c = 215.0, cooler_capacity_mw = 30.0, start_duty_mw = 15.0 },
    { draw_stage = 10, return_stage = 9, outlet = "gas_oil_pa_pump", flow_kg_per_s = 65.0, return_temperature_c = 270.0, cooler_capacity_mw = 30.0, start_duty_mw = 10.0 },
]

