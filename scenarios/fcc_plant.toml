# M4.2 demo plant: gasoil → furnace → FCC riser → column → three product tanks.
#
# The milestone's showcase, and the first plant in the workspace where a REACTOR
# feeds a COLUMN. Vacuum gasoil is preheated, cracked by the 4-lump Arrhenius
# kinetics (`reactions = "fcc"`) at a riser outlet temperature the reactor holds,
# and the cracked slate is then separated by boiling range into light gases,
# gasoline, and a heavy bottoms carrying the unconverted gasoil and the coke.
#
# What this demonstrates that `fcc_reactor.toml` (M4.1) cannot: the conversion is
# COMPUTED from kinetics rather than read from a fixed table, so it responds to
# the reactor's `t_set_c` and `tau_s`; and the products go somewhere, which is
# what makes the coke lump's deliberately high boiling point observable — the
# column routes it to bottoms, the claim DESIGN §5 makes when it accepts coke as
# an awkward pseudo-component.
#
# Units at this boundary are human-friendly (bar, °C, s); the loader converts to
# SI.

[meta]
name = "fcc_plant"
description = "Gasoil preheated, cracked by 4-lump FCC kinetics, and separated into gas, gasoline and bottoms."

[simulation]
dt = 0.1            # seconds per tick

[fidelity]
flow = "newton"
thermo = "constant"
reactions = "fcc"   # FCC 4-lump Arrhenius kinetics, RK4 over tau_s (M4.2)

# --- the FCC lump slate -------------------------------------------------------
# The four kinetic lumps are ordinary slate members (DESIGN §5, fork 1), so the
# column separates them with no knowledge that a reactor exists. `coke` carries a
# deliberately high boiling point: it does not boil, and giving it one is what
# routes it to the bottoms draw instead of leaving it unroutable.

[[components]]
name = "gas"
tb_c = -40.0
molar_mass_kg_per_mol = 0.030
density_kg_per_m3 = 400.0
cp_j_per_kg_k = 2500.0

[[components]]
name = "gasoline"
tb_c = 100.0
molar_mass_kg_per_mol = 0.100
density_kg_per_m3 = 720.0
cp_j_per_kg_k = 2200.0

[[components]]
name = "gasoil"
tb_c = 400.0
molar_mass_kg_per_mol = 0.300
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 2000.0

[[components]]
name = "coke"
tb_c = 900.0
molar_mass_kg_per_mol = 0.600
density_kg_per_m3 = 1200.0
cp_j_per_kg_k = 1500.0

# --- the plant ----------------------------------------------------------------

# Fresh vacuum gasoil.
[nodes.vgo_feed]
type = "source"
pressure_bar = 8.0
temperature_c = 300.0
composition = { gasoil = 1.0 }

# Feed preheat. The reactor holds its own outlet temperature, so this duty does
# not set the cracking severity — it is here because a real riser feed is
# preheated, and because it shows the reactor overriding an inlet temperature.
[nodes.preheater]
type = "furnace"
duty_mw = 4.0
# Tube coil (docs/DESIGN.md §37): 1 MJ/K per rated MW (its 4 MW); UA twice
# the load flow's 81.98 kW/K capacity rate; and the coil's steady temperature
# at load, the root of Q·(T_f − T_c)/(T_f − T_a) = G·(T_c − T_in)
# (§40 fork 5; Q = 4000 kW, G = 0.8647·81.98 kW/K, T_in = 300.13 °C), so the plant starts settled.
coil_heat_capacity_mj_per_k = 4
coil_ua_kw_per_k = 164
coil_temperature_c = 347.00
# Flame (docs/DESIGN.md §40): methane in air at the stoichiometric ratio,
# 2224.25 K (Marzouk 2023, doi:10.48084/etasr.6132). The duty is what the
# burners release; the coil absorbs (T_f − T_c)/(T_f − 20 °C) of it, 0.831 at load,
# and the rest goes up the stack.
flame_temperature_c = 1951.1
# Tubes (docs/DESIGN.md §42): past `tube_failure_c` the coil bursts, opening a
# hole of `tube_rupture_area_cm2` in the outlet pipe; while burst, what leaks
# burns in the firebox at `fluid_heating_value_mj_per_kg`. The limit and the
# hole are ROUND GAME-TUNING VALUES, not a cited metal limit: 550 °C, far above
# anything this coil reaches in service; a 1 cm² hole. The heating value is 42.8
# MJ/kg, the lower heating value of gas oil, Engineering ToolBox.
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.8

# The riser, held at a cracking ROT. Zero-volume and hydraulically a
# pass-through; the duty needed to hold t_set against the endotherm is emergent
# and reported, not configured.
[nodes.riser]
type = "reactor"
t_set_c = 527.0     # 800.15 K — the band the calibrated kinetics are pinned in
tau_s = 3.0

# The main fractionator. Pinned pressure (columns run on pressure control); the
# draws are in ascending boiling order and the last is the open-topped catch-all.
[nodes.fractionator]
type = "column"
pressure_bar = 1.6
smearing_k = 25.0
draws = [
    { outlet = "gas_drum", up_to_c = 20.0 },
    { outlet = "gasoline_tank", up_to_c = 250.0 },
    { outlet = "bottoms_tank" },
]

[nodes.gas_drum]
type = "tank"
area_m2 = 6.0
height_m = 10.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { gas = 1.0 }

[nodes.gasoline_tank]
type = "tank"
area_m2 = 10.0
height_m = 12.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { gasoline = 1.0 }

[nodes.bottoms_tank]
type = "tank"
area_m2 = 8.0
height_m = 12.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { gasoil = 1.0 }

# --- pipes --------------------------------------------------------------------

[[pipes]]
name = "feed_line"
from = "vgo_feed"
to = "preheater"
length_m = 25.0
diameter_m = 0.08

[[pipes]]
name = "hot_feed_line"
from = "preheater"
to = "riser"
length_m = 15.0
diameter_m = 0.08

[[pipes]]
name = "reactor_effluent"
from = "riser"
to = "fractionator"
length_m = 20.0
diameter_m = 0.08

[[pipes]]
name = "gas_draw"
from = "fractionator"
to = "gas_drum"
length_m = 20.0
diameter_m = 0.10

[[pipes]]
name = "gasoline_draw"
from = "fractionator"
to = "gasoline_tank"
length_m = 20.0
diameter_m = 0.10

[[pipes]]
name = "bottoms_draw"
from = "fractionator"
to = "bottoms_tank"
length_m = 20.0
diameter_m = 0.12
