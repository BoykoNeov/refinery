# M62.4 demo plant: the crude unit as a plant that models boiling
# (docs/DESIGN.md §67.12–§67.16).
#
# `crude_unit.toml` (M60.3) on the line flash, every piece M62.4 built:
#
# - THE FEED through a control valve (the heater's pass flow valve, fully
#   open) from the 30 bar charge into the furnace's COIL: 800 m of 24 cm tube
#   in eight cells (M62.4c), which the 270 °C crude enters liquid at about
#   15 bar — above its bubble pressure — and leaves boiling at about 2.1 bar,
#   41 % vapour by mass. The stream's temperature peaks partway along the coil
#   and falls toward its outlet as the falling pressure flashes more of it.
# - THE TRANSFER LINE two-phase, 40 cm (8 cm chokes on its vapour), into the
#   heat-balance column, which takes its feed's latent heat and draws its
#   products as liquids at their stages (M62.4a).
# - PRODUCT LINES (M62.4b): every draw falls 15 m to its pump (40 m of head),
#   which pushes it through a water cooler and 15 m up into its tank, so the
#   products reach their 1-atm tanks liquid and nothing vents. The coolers run
#   on cooling water from 30 °C, returning near 45 °C — about 990 kg/s of it.
#   Uncooled, a fifth of the column's output went up the tanks' vents.
# - THE TUBES burst at 550 °C, as in every furnace plant; burst, their hole on
#   the transfer line is a choked boiling jet (M62.4d).
#
# What it still does not have: steam stripping (M63, on water, M62.5–M62.6) —
# the column keeps its reboiler, which runs near 586 °C.
#
# Generated by `tools/steptime/prototypes/m62_4/make_boiling.py` from
# `crude_unit.toml`.

[meta]
name = "crude_unit_boiling"
description = "The crude unit as a plant that models boiling: a coil the crude boils in, a two-phase transfer line, and product lines cooled before their tanks."

[simulation]
dt = 0.1

[[components]]
name = "light_naphtha"
tb_c = 70.0
molar_mass_kg_per_mol = 0.095
density_kg_per_m3 = 680.0
cp_j_per_kg_k = 2200.0

[[components]]
name = "heavy_naphtha"
tb_c = 150.0
molar_mass_kg_per_mol = 0.13
density_kg_per_m3 = 750.0
cp_j_per_kg_k = 2100.0

[[components]]
name = "kerosene"
tb_c = 220.0
molar_mass_kg_per_mol = 0.17
density_kg_per_m3 = 800.0
cp_j_per_kg_k = 2050.0

[[components]]
name = "diesel"
tb_c = 300.0
molar_mass_kg_per_mol = 0.22
density_kg_per_m3 = 850.0
cp_j_per_kg_k = 2000.0

[[components]]
name = "gas_oil"
tb_c = 380.0
molar_mass_kg_per_mol = 0.3
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 1950.0

[[components]]
name = "residue"
tb_c = 560.0
molar_mass_kg_per_mol = 0.55
density_kg_per_m3 = 980.0
cp_j_per_kg_k = 1850.0

[fidelity]
flow = "newton"
thermo = "trouton"
separation = "heat_balance"
reactions = "none"
boiloff = "flash"
line_flash = "equilibrium"

[nodes.crude_source]
type = "source"
pressure_bar = 30.0
temperature_c = 270.0
composition = { light_naphtha = 0.08, heavy_naphtha = 0.14, kerosene = 0.16, diesel = 0.20, gas_oil = 0.14, residue = 0.28 }

[nodes.feed_valve]
type = "valve"
kv = 135.0
opening = 1.0

[nodes.furnace]
type = "furnace"
duty_mw = 20.0
coil_heat_capacity_mj_per_k = 45.0
coil_ua_kw_per_k = 600
coil_temperature_c = 359.5
flame_temperature_c = 1951.1
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.686
coil_cells = 8
coil_length_m = 800.0
coil_diameter_m = 0.24

[nodes.column]
type = "column"
pressure_bar = 1.8
draws = [
    { outlet = "naphtha_pump", stage = 0, draw_ratio = 0.22 },
    { outlet = "kerosene_pump", stage = 3, draw_ratio = 0.16 },
    { outlet = "diesel_pump", stage = 5, draw_ratio = 0.2 },
    { outlet = "gas_oil_pump", stage = 7, draw_ratio = 0.14 },
    { outlet = "residue_pump", stage = 10 },
]

[nodes.column.cascade]
stages = 10
feed_stage = 8
reflux_ratio = 4.0
pumparounds = [{ stage = 4, duty_mw = 15.0 }, { stage = 6, duty_mw = 15.0 }, { stage = 7, duty_mw = 10.0 }]

[nodes.naphtha_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { light_naphtha = 1.0 }

[nodes.kerosene_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { kerosene = 1.0 }

[nodes.diesel_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { diesel = 1.0 }

[nodes.gas_oil_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { gas_oil = 1.0 }

[nodes.residue_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { residue = 1.0 }

[[pipes]]
name = "crude_line"
from = "crude_source"
to = "feed_valve"
length_m = 30.0
diameter_m = 0.30

[[pipes]]
name = "feed_spool"
from = "feed_valve"
to = "furnace"
length_m = 5.0
diameter_m = 0.30

[[pipes]]
name = "transfer_line"
from = "furnace"
to = "column"
length_m = 15.0
diameter_m = 0.40

[[pipes]]
name = "naphtha_suction"
from = "column"
to = "naphtha_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "kerosene_suction"
from = "column"
to = "kerosene_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "diesel_suction"
from = "column"
to = "diesel_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "gas_oil_suction"
from = "column"
to = "gas_oil_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "residue_suction"
from = "column"
to = "residue_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0


[nodes.naphtha_pump]
type = "pump"
h0_m = 40.0
a = 2000.0
on = true

[nodes.naphtha_cooler]
type = "water_cooler"
ua_kw_per_k = 150.0
water_inlet_c = 30.0
water_flow_kg_per_s = 75.0

[[pipes]]
name = "naphtha_discharge"
from = "naphtha_pump"
to = "naphtha_cooler"
length_m = 30.0
diameter_m = 0.15

[[pipes]]
name = "naphtha_rundown"
from = "naphtha_cooler"
to = "naphtha_tank"
length_m = 100.0
diameter_m = 0.15
elevation_change_m = 15.0

[nodes.kerosene_pump]
type = "pump"
h0_m = 40.0
a = 2000.0
on = true

[nodes.kerosene_cooler]
type = "water_cooler"
ua_kw_per_k = 90.0
water_inlet_c = 30.0
water_flow_kg_per_s = 115.0

[[pipes]]
name = "kerosene_discharge"
