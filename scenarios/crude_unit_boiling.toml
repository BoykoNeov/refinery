length_m = 30.0
diameter_m = 0.15

[[pipes]]
name = "diesel_rundown"
from = "diesel_cooler"
to = "diesel_tank"
length_m = 100.0
diameter_m = 0.15
elevation_change_m = 15.0

[nodes.gas_oil_pump]
