# M64.3 demo plant: the steamed crude unit stripped by its steam alone
# (docs/DESIGN.md §69.4, §69.9).
#
# `crude_unit_steam.toml` (M62.6) with its reboiler held at zero: no heat
# enters the column's bottom but the steam's, and the reflux is a result.
#
# - THE REBOILER is `reboiler_duty_mw = 0.0`: the bottom stage's energy
#   balance an equation of the column's Newton, the reflux ratio its unknown
#   (§69.1). The declared `reflux_ratio` only seeds the start.
# - THE FURNACE carries what the reboiler did: 58 MW, its coil starting at
#   the 436.88 °C it settles at, so the plant starts where it stays. The feed
#   reaches the column near 388 °C and flashes 0.888 of its moles — about
#   70 % of its mass, a real flash zone's — and the bottom stands at 364 °C on
#   the steam's 0.87 kg/s, a real atmospheric bottom's 340–370 °C. The column
#   runs from about 50 MW (below it the gas-oil tray runs dry) to past 82 MW
#   (the coil at 502 °C, under its 550 °C limit).
# - THE CHARGE is held on a flow loop, how a real unit runs: the feed valve
#   widened to Kv 400 and parked at the 0.419 that passes the steamed plant's
#   112.8 kg/s, a reverse-acting PI loop metering `crude_line`. The meter sits
#   upstream of its valve, as a real one does — and must here: the pipe into a
#   celled coil cannot be metered (docs/DEFERRED.md E30). Tick 1 runs at the
#   declared opening (no measurement before it, M19's rule), which is why the
#   opening is the one the loop settles at. Installed gain about 138 kg/s per
#   unit of opening, so 0.004 per kg/s is a loop gain of 0.55 against the
#   bound of 1.005 at dt = 0.1 s and T_i = 10 s.
# - THE PUMPAROUNDS are declared at zero: the screen's keys (M64.4). Past
#   about 20 MW on stage 6 or 7 the column cannot run.
#
# Starting a cold plant is ledger row C15: this one starts hot, its column
# started on tick 1 from the same column with its reboiler (§69.8).
#
# Generated by `tools/steptime/prototypes/m64_3/make_stripped.py` from
# `crude_unit_steam.toml`.

[meta]
name = "crude_unit_stripped"
description = "The steamed crude unit stripped by its steam alone: the reboiler held at zero, the reflux a result, the furnace carrying the heat and the charge held on a flow loop."

[simulation]
dt = 0.1

[[components]]
name = "light_naphtha"
tb_c = 70.0
molar_mass_kg_per_mol = 0.095
density_kg_per_m3 = 680.0
cp_j_per_kg_k = 2200.0

[[components]]
name = "heavy_naphtha"
tb_c = 150.0
molar_mass_kg_per_mol = 0.13
density_kg_per_m3 = 750.0
cp_j_per_kg_k = 2100.0

[[components]]
name = "kerosene"
tb_c = 220.0
molar_mass_kg_per_mol = 0.17
density_kg_per_m3 = 800.0
cp_j_per_kg_k = 2050.0

[[components]]
name = "diesel"
tb_c = 300.0
molar_mass_kg_per_mol = 0.22
density_kg_per_m3 = 850.0
cp_j_per_kg_k = 2000.0

[[components]]
name = "gas_oil"
tb_c = 380.0
molar_mass_kg_per_mol = 0.3
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 1950.0

[[components]]
name = "residue"
tb_c = 560.0
molar_mass_kg_per_mol = 0.55
density_kg_per_m3 = 980.0
cp_j_per_kg_k = 1850.0

[[components]]
name = "water"
tb_c = 100.0
molar_mass_kg_per_mol = 0.018015
density_kg_per_m3 = 998.0
cp_j_per_kg_k = 4184.0
dh_vap_j_per_mol = 40650.0
cp_vapour_j_per_kg_k = 2000.0
free_water = true

[fidelity]
flow = "newton"
thermo = "trouton"
separation = "heat_balance"
reactions = "none"
boiloff = "flash"
line_flash = "equilibrium"

[nodes.crude_source]
type = "source"
pressure_bar = 30.0
temperature_c = 270.0
composition = { light_naphtha = 0.07976, heavy_naphtha = 0.13958, kerosene = 0.15952, diesel = 0.1994, gas_oil = 0.13958, residue = 0.27916, water = 0.003 }

[nodes.feed_valve]
type = "valve"
kv = 400.0
opening = 0.419

[nodes.furnace]
type = "furnace"
duty_mw = 58.0
coil_heat_capacity_mj_per_k = 45.0
coil_ua_kw_per_k = 600
coil_temperature_c = 436.88
flame_temperature_c = 1951.1
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.686
coil_cells = 8
coil_length_m = 800.0
coil_diameter_m = 0.24

[nodes.column]
type = "column"
pressure_bar = 1.8
draws = [
    { outlet = "naphtha_pump", stage = 0, draw_ratio = 0.22 },
    { outlet = "sour_water_tank", stage = 0, phase = "water" },
    { outlet = "kerosene_pump", stage = 3, draw_ratio = 0.16 },
    { outlet = "diesel_pump", stage = 5, draw_ratio = 0.2 },
    { outlet = "gas_oil_pump", stage = 7, draw_ratio = 0.14 },
    { outlet = "residue_pump", stage = 10 },
]

[nodes.column.cascade]
stages = 10
feed_stage = 8
reflux_ratio = 4.0
reboiler_duty_mw = 0.0
steam = { pipe = "stripping_steam", stage = 10 }
pumparounds = [{ stage = 4, duty_mw = 0.0 }, { stage = 6, duty_mw = 0.0 }, { stage = 7, duty_mw = 0.0 }]

[nodes.steam_supply]
type = "source"
pressure_bar = 10.0
temperature_c = 400.0
composition = { water = 1.0 }

[nodes.steam_valve]
type = "valve"
kv = 80.0
opening = 0.4
x_t = 0.72

[nodes.sour_water_tank]
type = "tank"
area_m2 = 10.0
height_m = 10.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { water = 1.0 }

[nodes.naphtha_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { light_naphtha = 1.0 }

[nodes.kerosene_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { kerosene = 1.0 }

[nodes.diesel_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { diesel = 1.0 }

[nodes.gas_oil_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { gas_oil = 1.0 }

[nodes.residue_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { residue = 1.0 }

[[pipes]]
name = "crude_line"
from = "crude_source"
to = "feed_valve"
length_m = 30.0
diameter_m = 0.30

[[pipes]]
name = "feed_spool"
from = "feed_valve"
to = "furnace"
length_m = 5.0
diameter_m = 0.30

[[pipes]]
name = "steam_header"
from = "steam_supply"
to = "steam_valve"
length_m = 30.0
diameter_m = 0.15

[[pipes]]
name = "stripping_steam"
from = "steam_valve"
to = "column"
length_m = 10.0
diameter_m = 0.15

[[pipes]]
name = "transfer_line"
from = "furnace"
to = "column"
length_m = 15.0
diameter_m = 0.40

[[pipes]]
name = "water_draw"
from = "column"
to = "sour_water_tank"
length_m = 40.0
diameter_m = 0.05
elevation_change_m = -15.0

[[pipes]]
name = "naphtha_suction"
from = "column"
to = "naphtha_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "kerosene_suction"
from = "column"
to = "kerosene_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "diesel_suction"
from = "column"
to = "diesel_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "gas_oil_suction"
from = "column"
to = "gas_oil_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "residue_suction"
from = "column"
to = "residue_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0


[nodes.naphtha_pump]
type = "pump"
h0_m = 40.0
a = 2000.0
on = true

[nodes.naphtha_cooler]
type = "water_cooler"
ua_kw_per_k = 150.0
water_inlet_c = 30.0
water_flow_kg_per_s = 75.0

[[pipes]]
name = "naphtha_discharge"
from = "naphtha_pump"
to = "naphtha_cooler"
length_m = 30.0
diameter_m = 0.15

[[pipes]]
name = "naphtha_rundown"
from = "naphtha_cooler"
to = "naphtha_tank"
length_m = 100.0
diameter_m = 0.15
elevation_change_m = 15.0

[nodes.kerosene_pump]
type = "pump"
h0_m = 40.0
a = 2000.0
on = true

[nodes.kerosene_cooler]
type = "water_cooler"
ua_kw_per_k = 90.0
water_inlet_c = 30.0
water_flow_kg_per_s = 115.0

[[pipes]]
