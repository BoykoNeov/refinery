[[pipes]]
name = "kero_pa_return"
from = "kero_pa_cooler"
to = "column"
length_m = 30.0
diameter_m = 0.3
elevation_change_m = 15.6

[[pipes]]
name = "diesel_pa_suction"
from = "column"
to = "diesel_pa_pump"
length_m = 20.0
diameter_m = 0.3
elevation_change_m = -15.0

[[pipes]]
name = "diesel_pa_discharge"
from = "diesel_pa_pump"
to = "diesel_pa_cooler"
length_m = 30.0
