# M57.2 demo plant: a hydrocracker's catalyst bed on a calm day.
#
# Vacuum gas oil, preheated to 365 °C, flows through one catalyst bed whose own
# heat sets its temperature (docs/DESIGN.md §62). The bed cracks the oil to
# distillate, naphtha and light ends (`reactions = "hydrocracking"`, §62.3); the
# cracking RELEASES heat, faster the hotter the bed, so the bed sits above its
# feed — about 9 K above it here, on the cool one of its steady states.
#
# The same bed has a second, hot steady state near 740 °C, where nearly
# everything cracks to light ends. Calm holds only inside a window: about 10 K
# more preheat, or a feed cut by about 40%, and the calm state is gone and the bed
# runs away to the hot one (§62.9). Bringing the feed back does not bring it
# back: the hot state holds down to a feed of about 237 °C.
#
# This file is the CALM day and nothing in it disturbs it: a plant file cannot
# schedule an event. `hydrocracker_runaway.toml` is the same bed with its feed
# already too hot, and it runs away on its own. Later slices (a trip on the bed,
# quench, the reactor screen) start from a COPY of this file; it is not edited,
# so its corpus fingerprint stays an anchor.
#
# Sizing: about 50 kg/s of feed (~ 30 000 barrels a day) through 20 m³ of
# catalyst — a residence time of 0.1 h, one bed of a several-bed reactor. The
# bed's heat capacity, 30 MJ/K, is its catalyst (about 15 t at ~1 kJ/(kg·K)) and
# the oil in its voids (~15 MJ/K). Every lump carries one capacity, 3.2 kJ/(kg·K)
# (Song 2017's oil lumps span 3.05–3.58), so the full-conversion rise is
# 1 200 / 3.2 = 375 K. The light-ends lump is declared a liquid: the bed is
# liquid-full and hydrogen is not modelled (§62.7).

[meta]
name = "hydrocracker_bed"
description = "One hydrocracker catalyst bed, self-heating, on a calm day: 9 K above a 365 °C feed."

[simulation]
dt = 0.1

[fidelity]
flow = "newton"
thermo = "constant"
reactions = "hydrocracking"

# --- the four hydrocracking lumps (§62.3) --------------------------------------

[[components]]
name = "vgo"
tb_c = 450.0
molar_mass_kg_per_mol = 0.400
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 3200.0

[[components]]
name = "distillate"
tb_c = 260.0
molar_mass_kg_per_mol = 0.200
density_kg_per_m3 = 830.0
cp_j_per_kg_k = 3200.0

[[components]]
name = "naphtha"
tb_c = 120.0
molar_mass_kg_per_mol = 0.110
density_kg_per_m3 = 740.0
cp_j_per_kg_k = 3200.0

[[components]]
name = "gas"
tb_c = -10.0
molar_mass_kg_per_mol = 0.050
density_kg_per_m3 = 550.0
cp_j_per_kg_k = 3200.0

# --- the plant ----------------------------------------------------------------

[nodes.vgo_feed]
type = "source"
pressure_bar = 8.0
temperature_c = 365.0
composition = { vgo = 1.0 }

[nodes.feed_valve]
type = "valve"
kv = 110.0
opening = 1.0

[nodes.bed]
type = "bed_reactor"
bed_heat_capacity_mj_per_k = 30.0
catalyst_volume_m3 = 20.0
bed_temperature_c = 374.1
# The wall (M58, docs/DESIGN.md §63): it fails when the bed reaches 550 °C,
# opening a 1 cm² hole on the outlet line; what leaks burns at 42.8 MJ/kg and a
# tenth of that fire heats the bed. Round GAME values, not a sourced shell limit.
wall_failure_c = 550.0
wall_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.8
wall_fire_share = 0.1

[nodes.product]
type = "sink"
pressure_bar = 5.0
composition = { vgo = 1.0 }

[[pipes]]
name = "feed_line"
from = "vgo_feed"
to = "feed_valve"
length_m = 30.0
diameter_m = 0.25

[[pipes]]
name = "valve_line"
from = "feed_valve"
to = "bed"
length_m = 5.0
diameter_m = 0.25

[[pipes]]
name = "product_line"
from = "bed"
to = "product"
length_m = 30.0
diameter_m = 0.25
