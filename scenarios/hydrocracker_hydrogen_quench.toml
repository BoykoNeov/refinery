# M59.3 (docs/DESIGN.md §64.12): two hydrocracker beds in one hydrogen loop,
# and a HYDROGEN QUENCH between them.
#
#   oil:  vgo_feed (385 °C) -> feed_valve -> bed1 -> bed2 -> product
#   gas:  separator -> compressor -> tee -> loop_valve -> gas_heater -> pass1
#           -> mix -> pass2 -> gas_cooler -> separator
#         tee -> quench_check -> quench_valve -> mix               (the quench)
#         makeup -> makeup_valve -> separator;  separator -> vent_valve -> flare
#
# Each bed is the M59.2 bed, consuming its hydrogen. The first bed, fed 385 °C
# oil and about 5 kg/s of hydrogen at 385 °C, is calm near 404 °C. The second
# takes that hot, part-cracked oil and the first bed's hydrogen at the first
# bed's temperature, and on its own it runs away: with the quench at its
# minimum and no trip, past 480 °C at 20 minutes, its wall failed 28 minutes
# in.
#
# **The quench** (docs/DESIGN.md §64.5, §62.11): cold hydrogen from the
# compressor's discharge, about 70 °C, mixed into the first bed's hydrogen
# outflow ahead of the second bed's pass — the real plant's quench. Oil and
# hydrogen keep their own pressures through a bed and share its temperature
# (§64.2), so the quench cools the second bed through its hydrogen: at fixed
# openings, about 1 kg/s holds it near 395 °C and 2 kg/s near 373 °C. What the
# quench takes from the discharge the first bed's pass no longer gets, so the
# first bed warms a few kelvin as the quench opens — the gas twin of M57.4's
# back-pressure.
#
# **The loops.** `bed2_temperature` holds the second bed at 400 °C by setting
# the target of `quench_flow`, which holds the quench's flow with the quench
# valve — the real plant's two-controller arrangement. More quench cools the bed
# only while the quench is colder than the hydrogen it joins, so the engine
# checks that at load and at the top of every tick; a bed loop in AUTO whose
# quench is not cold is switched to MANUAL, to be put back by hand. The
# faceplate's `quench` shows the two temperatures. `separator_pressure` holds
# the loop with makeup; `gas_heater_outlet` holds the first bed's hydrogen at
# the oil's 385 °C.
#
# **The backup trip.** `bed2_high` fires at 420 °C on the second bed and
# DEPRESSURES the loop — opens the vent, shuts the makeup — the standard
# emergency action on an excursion (§64.4, the user's choice for this plant).
# Reset by hand. Venting catches an excursion and does not undo a runaway
# (§64.0), which is why it is set 20 K over the loop's target.
#
# What a run shows: the second bed, born at 395 °C with the quench at its
# minimum, peaks at 400.46 °C and settles on 400.00 °C on 0.91 kg/s of quench,
# the valve about a quarter open, the first bed at 405 °C. With
# `bed2_temperature` in MANUAL the trip fires five minutes in and the starved
# bed turns at about 432 °C, back near its feed by 40 minutes.
#
#   cargo run -p refinery-cli -- run scenarios/hydrocracker_hydrogen_quench.toml --ticks 36000
#
# The quench flow loop's target cannot be zero — zero is "shut", a manual act
# (§24 fork 4) — so the cascade's range starts at 0.1 kg/s.

[meta]
name = "hydrocracker_hydrogen_quench"
description = "Two hydrocracker beds in one hydrogen loop; a cascade on a cold-hydrogen quench holds the second at 400 °C where it would run away, with a depressuring trip as the backup."

[simulation]
dt = 0.1

[fidelity]
flow = "newton"
thermo = "constant"
reactions = "hydrocracking"

[[components]]
name = "vgo"
tb_c = 450.0
molar_mass_kg_per_mol = 0.400
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 3200.0

[[components]]
name = "distillate"
tb_c = 260.0
molar_mass_kg_per_mol = 0.200
density_kg_per_m3 = 830.0
cp_j_per_kg_k = 3200.0

[[components]]
name = "naphtha"
tb_c = 120.0
molar_mass_kg_per_mol = 0.110
density_kg_per_m3 = 740.0
cp_j_per_kg_k = 3200.0

[[components]]
name = "gas"
tb_c = -10.0
molar_mass_kg_per_mol = 0.050
density_kg_per_m3 = 550.0
cp_j_per_kg_k = 3200.0

# Hydrogen: 2.016 g/mol, cp 14.3 kJ/(kg·K) near room temperature (recalled
# standard values; γ = cp/(cp − R/M) ≈ 1.40).
[[components]]
name = "hydrogen"
phase = "gas"
tb_c = -252.87
molar_mass_kg_per_mol = 0.002016
cp_j_per_kg_k = 14300.0

# Cooling water for the gas cooler: inert to the chemistry (a slate member the
# reaction does not name keeps its mass).
[[components]]
name = "water"
tb_c = 100.0
molar_mass_kg_per_mol = 0.018015
density_kg_per_m3 = 998.0
cp_j_per_kg_k = 4180.0

# --- the oil -----------------------------------------------------------------

[nodes.vgo_feed]
type = "source"
pressure_bar = 8.0
temperature_c = 385.0
composition = { vgo = 1.0 }

[nodes.feed_valve]
type = "valve"
kv = 110.0
opening = 1.0

[nodes.bed1]
type = "bed_reactor"
bed_heat_capacity_mj_per_k = 30.0
catalyst_volume_m3 = 20.0
bed_temperature_c = 404.0
wall_failure_c = 550.0
wall_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.8
wall_fire_share = 0.1

[nodes.bed2]
type = "bed_reactor"
bed_heat_capacity_mj_per_k = 30.0
catalyst_volume_m3 = 20.0
bed_temperature_c = 395.0
wall_failure_c = 550.0
wall_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.8
wall_fire_share = 0.1

[nodes.product]
type = "sink"
pressure_bar = 5.0
composition = { vgo = 1.0 }

# --- the hydrogen loop --------------------------------------------------------

[nodes.separator]
type = "vessel"
volume_m3 = 100.0
pressure_bar = 150.0
temperature_c = 50.0
composition = { hydrogen = 1.0 }

[nodes.compressor]
type = "compressor"
head_kj_per_kg = 120.0
head_curve_kj_per_kg_s2_per_m6 = 100.0
polytropic_efficiency = 0.75

[nodes.loop_valve]
type = "valve"
kv = 60.0
opening = 1.0
x_t = 0.7

[nodes.gas_heater]
type = "furnace"
duty_mw = 24.0
coil_heat_capacity_mj_per_k = 5.0
coil_ua_kw_per_k = 200.0
coil_temperature_c = 415.0
flame_temperature_c = 1951.1
tube_failure_c = 650.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 119.96

# The hydrogen through the bed. hydrogen_order is a GAME VALUE (§64.1), and so
# are the uptake figures (§64.11): kg of hydrogen per kg of each lump formed,
# the feed's vgo the datum.
[nodes.pass1]
type = "bed_hydrogen"
bed = "bed1"
hydrogen_order = 0.5
hydrogen_reference_bar = 155.0
hydrogen_uptake_kg_per_kg = { distillate = 0.020, naphtha = 0.035, gas = 0.070 }

[nodes.mix]
type = "junction"

[nodes.pass2]
type = "bed_hydrogen"
bed = "bed2"
hydrogen_order = 0.5
hydrogen_reference_bar = 155.0
hydrogen_uptake_kg_per_kg = { distillate = 0.020, naphtha = 0.035, gas = 0.070 }

[nodes.tee]
type = "junction"

# Keeps the first bed's hydrogen out of the discharge should the quench line's
# pressure ever reverse (M57.4's reason, §62.11 "not caught").
[nodes.quench_check]
type = "check_valve"
kv = 100.0
full_open_bar = 0.1
x_t = 0.72

# The quench valve: at the quench's 0.1 kg/s minimum at load; `quench_flow`
# moves it.
[nodes.quench_valve]
type = "valve"
kv = 40.0
opening = 0.03
x_t = 0.7

# The gas cooler: the hydrogen against cooling water, an exchanger whose
# effectiveness holds the gas near the water's temperature at any flow.
[nodes.gas_cooler]
type = "heat_exchanger"

[nodes.cw_side]
type = "heat_exchanger"

[nodes.cw_supply]
type = "source"
pressure_bar = 5.0
temperature_c = 30.0
composition = { water = 1.0 }

[nodes.cw_return]
type = "sink"
pressure_bar = 2.0
temperature_c = 30.0
composition = { water = 1.0 }

[[exchangers]]
side_a = "gas_cooler"
side_b = "cw_side"
effectiveness = 0.9

[nodes.makeup]
type = "source"
pressure_bar = 170.0
temperature_c = 40.0
composition = { hydrogen = 1.0 }

[nodes.makeup_valve]
type = "valve"
kv = 5.0
opening = 0.0
x_t = 0.7

[nodes.vent_valve]
type = "valve"
kv = 10.0
opening = 0.0
x_t = 0.7

[nodes.flare]
type = "sink"
pressure_bar = 2.0
temperature_c = 40.0
composition = { hydrogen = 1.0 }

# --- pipes --------------------------------------------------------------------

[[pipes]]
name = "feed_line"
from = "vgo_feed"
to = "feed_valve"
length_m = 30.0
diameter_m = 0.25

[[pipes]]
name = "valve_line"
from = "feed_valve"
to = "bed1"
length_m = 5.0
diameter_m = 0.25

[[pipes]]
name = "interbed_line"
from = "bed1"
to = "bed2"
length_m = 5.0
diameter_m = 0.25

[[pipes]]
name = "product_line"
from = "bed2"
to = "product"
length_m = 30.0
diameter_m = 0.25

[[pipes]]
name = "suction_line"
from = "separator"
to = "compressor"
length_m = 20.0
diameter_m = 0.2

[[pipes]]
name = "discharge_line"
from = "compressor"
to = "tee"
length_m = 10.0
diameter_m = 0.2

[[pipes]]
name = "loop_line"
from = "tee"
to = "loop_valve"
length_m = 20.0
diameter_m = 0.2

[[pipes]]
name = "heater_inlet"
from = "loop_valve"
to = "gas_heater"
length_m = 10.0
diameter_m = 0.2

[[pipes]]
name = "reactor_gas_line"
from = "gas_heater"
to = "pass1"
length_m = 20.0
diameter_m = 0.2

[[pipes]]
name = "interbed_gas"
from = "pass1"
to = "mix"
length_m = 5.0
diameter_m = 0.2

[[pipes]]
name = "bed2_gas_line"
from = "mix"
to = "pass2"
length_m = 5.0
diameter_m = 0.2

[[pipes]]
name = "quench_supply"
from = "tee"
to = "quench_check"
length_m = 10.0
diameter_m = 0.1

[[pipes]]
name = "quench_check_line"
from = "quench_check"
to = "quench_valve"
length_m = 20.0
diameter_m = 0.1

[[pipes]]
name = "quench_line"
from = "quench_valve"
to = "mix"
length_m = 20.0
diameter_m = 0.1

[[pipes]]
name = "reactor_gas_outlet"
from = "pass2"
to = "gas_cooler"
length_m = 20.0
diameter_m = 0.2

[[pipes]]
name = "separator_inlet"
from = "gas_cooler"
to = "separator"
length_m = 20.0
diameter_m = 0.2

[[pipes]]
name = "cw_inlet"
from = "cw_supply"
to = "cw_side"
length_m = 30.0
diameter_m = 0.1

[[pipes]]
name = "cw_outlet"
from = "cw_side"
to = "cw_return"
length_m = 30.0
diameter_m = 0.15

[[pipes]]
name = "makeup_line"
from = "makeup"
to = "makeup_valve"
length_m = 20.0
diameter_m = 0.05

[[pipes]]
name = "makeup_inlet"
from = "makeup_valve"
to = "separator"
length_m = 10.0
diameter_m = 0.05

[[pipes]]
name = "vent_line"
from = "separator"
to = "vent_valve"
length_m = 10.0
diameter_m = 0.1

[[pipes]]
name = "flare_line"
from = "vent_valve"
to = "flare"
length_m = 30.0
diameter_m = 0.15

# --- control ------------------------------------------------------------------

[[controls]]
name = "separator_pressure"
measurement = { node = "separator", variable = "pressure" }
actuator = "makeup_valve"
algorithm = "pi"
mode = "auto"
action = "reverse"
setpoint_bar = 150.0
gain_per_bar = 0.2
integral_time_s = 30.0
initial_output = 0.0

[[controls]]
name = "gas_heater_outlet"
measurement = { node = "gas_heater", variable = "temperature" }
actuator = "gas_heater"
algorithm = "pi"
mode = "auto"
action = "reverse"
setpoint_c = 385.0
gain_per_k = 0.02
integral_time_s = 60.0
initial_output = 0.5
max_duty_mw = 48.0


[[controls]]
name = "bed2_temperature"
measurement = { node = "bed2", variable = "temperature" }
actuator = { loop = "quench_flow" }
algorithm = "pi"
mode = "auto"
action = "direct"
setpoint_c = 400.0
gain_per_k = 0.1
integral_time_s = 300.0
initial_output = 0.0
range_min_kg_per_s = 0.1
range_max_kg_per_s = 4.0

[[controls]]
name = "quench_flow"
measurement = { pipe = "quench_line", variable = "flow" }
actuator = "quench_valve"
algorithm = "pi"
mode = "auto"
action = "reverse"
setpoint_kg_per_s = 0.1
gain_per_kg_per_s = 0.02
integral_time_s = 10.0
initial_output = 0.03

# The backup: fires AT OR ABOVE 420 °C on the second bed and depressures the
# loop. Reset by hand.
[[trips]]
name = "bed2_high"
measurement = { node = "bed2", variable = "temperature" }
direction = "high"
limit_c = 420.0
actions = [{ valve = "vent_valve", position = 1.0 }, { valve = "makeup_valve", position = 0.0 }]
