# M2.2 reference plant: cold feed → fired heater → product sink.
#
# The smallest plant that wires a furnace: one pressure-driven stream, one
# unit, nothing else that could move a temperature. Its purpose is to pin the
# furnace AS WIRED — the MW→W conversion in the loader, the duty reaching the
# temperature sweep, and the outlet stream carrying the heated temperature —
# none of which `core::energy`'s unit tests can see, since they hand-build
# their flow maps and never touch the loader or the engine tick.
#
# Units at this boundary are human-friendly (bar, °C, MW); the loader converts
# to SI. See refinery-scenarios docs.

[meta]
name = "furnace_heater"
description = "Cold water feed heated by a fired heater on its way to a product sink."

[simulation]
dt = 0.1            # seconds per tick

[fidelity]
flow = "newton"
thermo = "constant"
reactions = "none"

[nodes.cold_feed]
type = "source"
pressure_bar = 3.0
temperature_c = 20.0

[nodes.heater]
type = "furnace"
duty_mw = 1.0       # released by the burners [MW], converted to W on load; what
                    # the coil absorbs reaches the fluid once it has settled (§40)
# Tube coil (docs/DESIGN.md §37): 1 MJ/K per rated MW (its 1 MW); UA twice
# the load flow's 232.13 kW/K capacity rate; and the coil's steady temperature
# at load, the root of Q·(T_f − T_c)/(T_f − T_a) = G·(T_c − T_in)
# (§40 fork 5; Q = 1000 kW, G = 0.8647·232.13 kW/K, T_in = 20.02 °C), so the plant starts settled.
coil_heat_capacity_mj_per_k = 1
coil_ua_kw_per_k = 464.3
coil_temperature_c = 24.99
# Flame (docs/DESIGN.md §40): methane in air at the stoichiometric ratio,
# 2224.25 K (Marzouk 2023, doi:10.48084/etasr.6132). The duty is what the
# burners release; the coil absorbs (T_f − T_c)/(T_f − 20 °C) of it, 0.997 at load,
# and the rest goes up the stack.
flame_temperature_c = 1951.1

[nodes.product]
type = "sink"
pressure_bar = 1.0
temperature_c = 20.0

[[pipes]]
name = "feed_line"
from = "cold_feed"
to = "heater"
length_m = 20.0
diameter_m = 0.10

[[pipes]]
name = "transfer_line"
from = "heater"
to = "product"
length_m = 20.0
diameter_m = 0.10
