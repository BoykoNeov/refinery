# M86.4 demo plant: a stopped product pump STOPS its product
# (docs/DESIGN.md §84.4).
#
# Both M86.4 plants (docs/DESIGN.md §84.4) are `crude_unit.toml` with a
# product line on every draw: the draw falls 15 m to its pump, which pushes it
# through a check valve and a water cooler to its tank; the transfer line is
# 40 cm. The column holds no liquid, so when a line cannot carry its product
# the column sends the rest down to the draw below (§84.2): a stopped
# kerosene, diesel or gas oil pump moves its product into the next one. A
# stopped residue pump halts the run, naming the pump: there is no draw below
# the bottoms. The check valve after each pump is what keeps a tank from
# pushing its product back through a stopped pump (§84.3).
#
# The two plants teach the two halves of what a stopped centrifugal pump
# does. A stopped centrifugal pump is not a closed valve: product still flows
# through it if something else pushes (Chaudhry 2014, Table A-1: a locked
# rotor loses about half its rated head at rated flow). What stops the product
# is what the line asks the pump to lift.
#
# HERE THE TANKS STAND HIGH. Each rundown climbs 40 m from its pump, so every
# tank's inlet is 25 m above the column's draws. The column's own push, its
# 0.8 bar over the air outside, lifts its products only about 10-12 m above
# its draws (the lighter naphtha furthest). With the pump stopped, nothing gets up to the tank: the
# line stops, the check valve's disc shuts, and the whole product goes to the
# draw below. With the pumps running (40 m of head each) every line carries
# 1.7-3.2 times its share, so the line below can take a stopped one's.
#
# A real refinery's tanks stand at grade; tanks this high are what it takes
# to make a stopped centrifugal pump stop its product completely.
# `crude_unit_pumps_grade.toml` is the plant as refineries build it.
#
# What still halts the run: the residue pump stopped; the naphtha pump stopped
# (a column with no distillate has no reflux, and this one cannot run without
# it); or the diesel and gas oil pumps stopped together, or all three side
# pumps, whose products the residue line cannot all carry.
#
# Generated by `tools/steptime/prototypes/m86_4/make_pumped.py lifted`.

[meta]
name = "crude_unit_pumps_lifted"
description = "The crude unit with its product tanks on high ground: a stopped product pump stops its product, and the column sends it to the draw below."

[simulation]
dt = 0.1

[[components]]
name = "light_naphtha"
tb_c = 70.0
molar_mass_kg_per_mol = 0.095
density_kg_per_m3 = 680.0
cp_j_per_kg_k = 2200.0

[[components]]
name = "heavy_naphtha"
tb_c = 150.0
molar_mass_kg_per_mol = 0.13
density_kg_per_m3 = 750.0
cp_j_per_kg_k = 2100.0

[[components]]
name = "kerosene"
tb_c = 220.0
molar_mass_kg_per_mol = 0.17
density_kg_per_m3 = 800.0
cp_j_per_kg_k = 2050.0

[[components]]
name = "diesel"
tb_c = 300.0
molar_mass_kg_per_mol = 0.22
density_kg_per_m3 = 850.0
cp_j_per_kg_k = 2000.0

[[components]]
name = "gas_oil"
tb_c = 380.0
molar_mass_kg_per_mol = 0.3
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 1950.0

[[components]]
name = "residue"
tb_c = 560.0
molar_mass_kg_per_mol = 0.55
density_kg_per_m3 = 980.0
cp_j_per_kg_k = 1850.0

[fidelity]
flow = "newton"
thermo = "trouton"
separation = "heat_balance"
reactions = "none"
boiloff = "none"

[nodes.crude_source]
type = "source"
pressure_bar = 30.0
temperature_c = 270.0
composition = { light_naphtha = 0.08, heavy_naphtha = 0.14, kerosene = 0.16, diesel = 0.20, gas_oil = 0.14, residue = 0.28 }

[nodes.furnace]
type = "furnace"
duty_mw = 20.0
coil_heat_capacity_mj_per_k = 45.0
coil_ua_kw_per_k = 600
coil_temperature_c = 359.5
flame_temperature_c = 1951.1
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.686

[nodes.column]
type = "column"
pressure_bar = 1.8
draws = [
    { outlet = "naphtha_pump", stage = 0, draw_ratio = 0.22 },
    { outlet = "kerosene_pump", stage = 3, draw_ratio = 0.16 },
    { outlet = "diesel_pump", stage = 5, draw_ratio = 0.2 },
    { outlet = "gas_oil_pump", stage = 7, draw_ratio = 0.14 },
    { outlet = "residue_pump", stage = 10 },
]

[nodes.column.cascade]
stages = 10
feed_stage = 8
reflux_ratio = 4.0
pumparounds = [{ stage = 4, duty_mw = 15.0 }, { stage = 6, duty_mw = 15.0 }, { stage = 7, duty_mw = 10.0 }]

[nodes.naphtha_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { light_naphtha = 1.0 }

[nodes.kerosene_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { kerosene = 1.0 }

[nodes.diesel_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { diesel = 1.0 }

[nodes.gas_oil_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { gas_oil = 1.0 }

[nodes.residue_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { residue = 1.0 }

[[pipes]]
name = "crude_line"
from = "crude_source"
to = "furnace"
length_m = 30.0
diameter_m = 0.08

[[pipes]]
name = "transfer_line"
from = "furnace"
to = "column"
length_m = 15.0
diameter_m = 0.40

[[pipes]]
name = "naphtha_suction"
from = "column"
to = "naphtha_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "kerosene_suction"
from = "column"
to = "kerosene_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "diesel_suction"
from = "column"
to = "diesel_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "gas_oil_suction"
from = "column"
to = "gas_oil_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "residue_suction"
from = "column"
to = "residue_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0


[nodes.naphtha_pump]
type = "pump"
h0_m = 40.0
a = 2000.0
on = true

[nodes.naphtha_check]
type = "check_valve"
kv = 400.0
full_open_bar = 0.015

[nodes.naphtha_cooler]
type = "water_cooler"
ua_kw_per_k = 150.0
water_inlet_c = 30.0
water_flow_kg_per_s = 75.0

[[pipes]]
name = "naphtha_discharge"
from = "naphtha_pump"
to = "naphtha_check"
length_m = 30.0
diameter_m = 0.15

[[pipes]]
name = "naphtha_check_outlet"
from = "naphtha_check"
to = "naphtha_cooler"
length_m = 1.0
diameter_m = 0.15

[[pipes]]
name = "naphtha_rundown"
from = "naphtha_cooler"
to = "naphtha_tank"
length_m = 100.0
diameter_m = 0.15
elevation_change_m = 40.0

