# M32 protection demo: a furnace with nobody minding it, and a trip that cuts its
# fuel before the tank it feeds gets too hot.
#
#   cool_feed (40 °C) -> heater (3 MW) -> hold_tank -> drain_valve -> rundown
#
# **Meant to be diffed against `tank_temperature_heating.toml`.** Same plant, line
# for line, except:
#
# | line | there | here | why |
# |---|---|---|---|
# | `heater.duty_mw` | 0.5, moved by a loop | 3.0, fixed | fired hard and left: the tank heads for ~90 °C, so there is something to protect against |
# | `[[controls]]` | a reverse PI loop on the furnace | none | nothing regulates the firing; the trip is the only thing between the tank and its feed's temperature |
# | `[[trips]]` | none | one high-temperature trip | the subject of the file |
#
# **A fuel cut is the furnace's ONE safe state** (docs/DESIGN.md §35). The action
# is `{ furnace = "heater" }` with no position: the trip writes zero duty, and the
# stream keeps flowing through the furnace. Since M34 the furnace has a coil
# (docs/DESIGN.md §37), so a cut furnace adds no heat of its own but goes on
# giving back what its coil holds: the fluid gains exactly what the coil loses
# until the coil reaches the feed's temperature.
#
# **What the trip does, measured on both fidelities** (§35). The tank first passes
# 75 °C at the end of tick 1 354 (75.0034 °C), so the trip fires at the top of
# tick 1 355 and the furnace reads zero duty on that tick's own snapshot. Until
# then the plant is bit for bit its own untripped twin. The tank then cools
# toward its feed: 47.71 °C by tick 3 000, 40.43 °C by tick 6 000. (Before M36
# every watt fired reached the tubes and the trip fired at 1 251; now 4 % of the
# 3 MW goes up the stack, docs/DESIGN.md §40.) The trip stays
# tripped the whole way down — it LATCHES, and only `reset_trip` re-arms it.
#
# **The condition does NOT clear inside the tick that trips — since M34.** Before
# the furnace had a coil, the whole tripping tick ran on cold feed and the tank
# ended it at 74.967 °C (§26, M22.1's finding). Now the coil (docs/DESIGN.md §37)
# is at 95.5 °C when the fuel goes and keeps warming the feed while it cools: a
# fuel cut is M22.1's SLOW action, and the tank goes on to 75.110 °C and is back
# under 75 °C from the end of tick 1 393. Throughout, and after, it is the LATCH, not
# the temperature, that keeps the fire out.
#
# **What happens without it.** Delete the `[[trips]]` block and the tank reads
# 87.82 °C at tick 6 000, still climbing toward the 87.97 °C its inflow carries.
# Water stays liquid there; on a plant with a hotter feed, or a stronger furnace,
# the same unattended firing would pass 100 °C, which a plant that does not
# select a boil-off model reports as liquid.
#
# **What this file cannot show.** The CLI issues no commands, so the reset, the
# refused relight, and a loop on the furnace yielding to the trip are exercised
# by the fixtures in `crates/scenarios/tests/furnace_trip_reference.rs`.
#
#   cargo run -p refinery-cli -- run scenarios/tank_overheat_trip.toml --ticks 6000

[meta]
name = "tank_overheat_trip"
description = "A furnace fired by hand heats a tank; a latching high-temperature trip cuts the furnace's fuel."

[simulation]
dt = 1.0

[fidelity]
flow = "newton"     # "newton" (research) | "simple" (game)
thermo = "constant"
reactions = "none"

[nodes.cool_feed]
type = "source"
pressure_bar = 1.6
temperature_c = 40.0

# Fired by hand at 3 MW and left there: nothing regulates it. The 2.88 MW its
# coil absorbs adds 47.97 K to the 14.36 kg/s feed, so the tank heads for about
# 88 °C.
[nodes.heater]
type = "furnace"
duty_mw = 3.0
# Tube coil (docs/DESIGN.md §37): 1 MJ/K per rated MW (its 3 MW); UA twice
# the load flow's 60.09 kW/K capacity rate; and the coil's steady temperature
# at load, the root of Q·(T_f − T_c)/(T_f − T_a) = G·(T_c − T_in)
# (§40 fork 5; Q = 3000 kW, G = 0.8647·60.09 kW/K, T_in = 40 °C), so the plant starts settled.
coil_heat_capacity_mj_per_k = 3
coil_ua_kw_per_k = 120.2
coil_temperature_c = 95.48
# Flame (docs/DESIGN.md §40): methane in air at the stoichiometric ratio,
# 2224.25 K (Marzouk 2023, doi:10.48084/etasr.6132). The duty is what the
# burners release; the coil absorbs (T_f − T_c)/(T_f − 20 °C) of it, 0.961 at load,
# and the rest goes up the stack.
flame_temperature_c = 1951.1
# Tubes (docs/DESIGN.md §42): past `tube_failure_c` the coil bursts, opening a
# hole of `tube_rupture_area_cm2` in the outlet pipe; while burst, what leaks
# burns in the firebox at `fluid_heating_value_mj_per_kg`. The limit and the
# hole are ROUND GAME-TUNING VALUES, not a cited metal limit: 550 °C, far above
# anything this coil reaches in service; a 1 cm² hole. The heating value is 0:
# water does not burn, so a hole leaks but lights nothing.
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 0.0

# The node the trip WATCHES. Its temperature is stored on the graph and exists
# from load (docs/DESIGN.md §26 fork 2); the level is the settled 4.968 m, so only
# the temperature has anywhere to go.
[nodes.hold_tank]
type = "tank"
area_m2 = 3.0
height_m = 10.0
initial_level_m = 4.968
temperature_c = 40.0

[nodes.drain_valve]
type = "valve"
kv = 150.0
opening = 0.5

[nodes.rundown]
type = "sink"
pressure_bar = 1.01325

[[pipes]]
name = "feed_line"
from = "cool_feed"
to = "heater"
length_m = 20.0
diameter_m = 0.10

[[pipes]]
name = "heated_line"
from = "heater"
to = "hold_tank"
length_m = 10.0
diameter_m = 0.10

[[pipes]]
name = "drain_line"
from = "hold_tank"
to = "drain_valve"
length_m = 10.0
diameter_m = 0.15

[[pipes]]
name = "rundown_line"
from = "drain_valve"
to = "rundown"
length_m = 10.0
diameter_m = 0.15

# Fires AT OR ABOVE 75 °C (docs/DESIGN.md §26 fork 6) and cuts the furnace's
# fuel. A furnace action takes no `position`: its only safe state is zero duty.
[[trips]]
name = "tank_high_temperature"
measurement = { node = "hold_tank", variable = "temperature" }
direction = "high"
limit_c = 75.0
actions = [{ furnace = "heater" }]
