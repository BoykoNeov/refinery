# M66 demo plant: the stripped crude unit before its start-up — the furnace
# low, the column on its reboiler (docs/DESIGN.md §71.4).
#
# `crude_unit_stripped.toml` (M64.3) as it stands before it is started: the
# same column, coil, steam and charge loop, at the steamed plant's own state.
#
# - THE REBOILER is free: it closes the column's energy balance at the
#   declared reflux of 4.0, about 88 MW, the bottom near 580 °C — the steamed
#   crude unit's column. A command holds it, or frees it again
#   (`SetReboilerDuty`, M66.1); held at a duty the column cannot run at, it
#   keeps the duty it ran at and says so (M66.2).
# - THE FURNACE is low, 20 MW: the crude reaches the column near 289 °C, too
#   cool for a column without its reboiler (that needs ~362 °C). Its coil
#   starts where this plant settles it, 322.06 °C.
# - THE PUMPAROUNDS are the steamed plant's 15/15/10 MW; a column on its
#   reboiler with none cannot make its cold start on tick 1.
# - THE CHARGE is held on the stripped plant's flow loop at 112.8 kg/s, its
#   valve declared at the 0.33737 the loop settles at here.
#
# The start-up (§71.0, §71.3): the furnace to 58 MW, the pumparounds off, and
# the reboiler walked down from the duty it runs at as the feed heats — the
# column declining the steps it cannot take yet. Settled, it is
# `crude_unit_stripped.toml`.
#
# Generated by `tools/steptime/prototypes/m66_3/make_cold.py` from
# `crude_unit_stripped.toml`.

[meta]
name = "crude_unit_cold"
description = "The stripped crude unit before its start-up: the furnace low at 20 MW, the column on its reboiler at a reflux of 4, the pumparounds on; started by commands to the stripped plant."

[simulation]
dt = 0.1

[[components]]
name = "light_naphtha"
tb_c = 70.0
molar_mass_kg_per_mol = 0.095
density_kg_per_m3 = 680.0
cp_j_per_kg_k = 2200.0

[[components]]
name = "heavy_naphtha"
tb_c = 150.0
molar_mass_kg_per_mol = 0.13
density_kg_per_m3 = 750.0
cp_j_per_kg_k = 2100.0

[[components]]
name = "kerosene"
tb_c = 220.0
molar_mass_kg_per_mol = 0.17
density_kg_per_m3 = 800.0
cp_j_per_kg_k = 2050.0

[[components]]
name = "diesel"
tb_c = 300.0
molar_mass_kg_per_mol = 0.22
density_kg_per_m3 = 850.0
cp_j_per_kg_k = 2000.0

[[components]]
name = "gas_oil"
tb_c = 380.0
molar_mass_kg_per_mol = 0.3
density_kg_per_m3 = 900.0
cp_j_per_kg_k = 1950.0

[[components]]
name = "residue"
tb_c = 560.0
molar_mass_kg_per_mol = 0.55
density_kg_per_m3 = 980.0
cp_j_per_kg_k = 1850.0

[[components]]
name = "water"
tb_c = 100.0
molar_mass_kg_per_mol = 0.018015
density_kg_per_m3 = 998.0
cp_j_per_kg_k = 4184.0
dh_vap_j_per_mol = 40650.0
cp_vapour_j_per_kg_k = 2000.0
free_water = true

[fidelity]
flow = "newton"
thermo = "trouton"
separation = "heat_balance"
reactions = "none"
boiloff = "flash"
line_flash = "equilibrium"

[nodes.crude_source]
type = "source"
pressure_bar = 30.0
temperature_c = 270.0
composition = { light_naphtha = 0.07976, heavy_naphtha = 0.13958, kerosene = 0.15952, diesel = 0.1994, gas_oil = 0.13958, residue = 0.27916, water = 0.003 }

[nodes.feed_valve]
type = "valve"
kv = 400.0
opening = 0.33737

[nodes.furnace]
type = "furnace"
duty_mw = 20.0
coil_heat_capacity_mj_per_k = 45.0
coil_ua_kw_per_k = 600
coil_temperature_c = 322.06
flame_temperature_c = 1951.1
tube_failure_c = 550.0
tube_rupture_area_cm2 = 1.0
fluid_heating_value_mj_per_kg = 42.686
coil_cells = 8
coil_length_m = 800.0
coil_diameter_m = 0.24

[nodes.column]
type = "column"
pressure_bar = 1.8
draws = [
    { outlet = "naphtha_pump", stage = 0, draw_ratio = 0.22 },
    { outlet = "sour_water_tank", stage = 0, phase = "water" },
    { outlet = "kerosene_pump", stage = 3, draw_ratio = 0.16 },
    { outlet = "diesel_pump", stage = 5, draw_ratio = 0.2 },
    { outlet = "gas_oil_pump", stage = 7, draw_ratio = 0.14 },
    { outlet = "residue_pump", stage = 10 },
]

[nodes.column.cascade]
stages = 10
feed_stage = 8
reflux_ratio = 4.0
steam = { pipe = "stripping_steam", stage = 10 }
pumparounds = [{ stage = 4, duty_mw = 15.0 }, { stage = 6, duty_mw = 15.0 }, { stage = 7, duty_mw = 10.0 }]

[nodes.steam_supply]
type = "source"
pressure_bar = 10.0
temperature_c = 400.0
composition = { water = 1.0 }

[nodes.steam_valve]
type = "valve"
kv = 80.0
opening = 0.4
x_t = 0.72

[nodes.sour_water_tank]
type = "tank"
area_m2 = 10.0
height_m = 10.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { water = 1.0 }

[nodes.naphtha_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { light_naphtha = 1.0 }

[nodes.kerosene_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { kerosene = 1.0 }

[nodes.diesel_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { diesel = 1.0 }

[nodes.gas_oil_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { gas_oil = 1.0 }

[nodes.residue_tank]
type = "tank"
area_m2 = 30.0
height_m = 30.0
initial_level_m = 0.5
temperature_c = 40.0
composition = { residue = 1.0 }

[[pipes]]
name = "crude_line"
from = "crude_source"
to = "feed_valve"
length_m = 30.0
diameter_m = 0.30

[[pipes]]
name = "feed_spool"
from = "feed_valve"
to = "furnace"
length_m = 5.0
diameter_m = 0.30

[[pipes]]
name = "steam_header"
from = "steam_supply"
to = "steam_valve"
length_m = 30.0
diameter_m = 0.15

[[pipes]]
name = "stripping_steam"
from = "steam_valve"
to = "column"
length_m = 10.0
diameter_m = 0.15

[[pipes]]
name = "transfer_line"
from = "furnace"
to = "column"
length_m = 15.0
diameter_m = 0.40

[[pipes]]
name = "water_draw"
from = "column"
to = "sour_water_tank"
length_m = 40.0
diameter_m = 0.05
elevation_change_m = -15.0

[[pipes]]
name = "naphtha_suction"
from = "column"
to = "naphtha_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "kerosene_suction"
from = "column"
to = "kerosene_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "diesel_suction"
from = "column"
to = "diesel_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "gas_oil_suction"
from = "column"
to = "gas_oil_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0

[[pipes]]
name = "residue_suction"
from = "column"
to = "residue_pump"
length_m = 20.0
diameter_m = 0.20
elevation_change_m = -15.0


[nodes.naphtha_pump]
type = "pump"
