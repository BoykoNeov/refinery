a = 2000.0
on = true

[nodes.naphtha_cooler]
type = "water_cooler"
ua_kw_per_k = 150.0
water_inlet_c = 30.0
water_flow_kg_per_s = 75.0

[[pipes]]
name = "naphtha_discharge"
from = "naphtha_pump"
to = "naphtha_cooler"
length_m = 30.0
diameter_m = 0.15

[[pipes]]
name = "naphtha_rundown"
from = "naphtha_cooler"
to = "naphtha_tank"
length_m = 100.0
diameter_m = 0.15
elevation_change_m = 15.0

[nodes.kerosene_pump]
type = "pump"
h0_m = 40.0
a = 2000.0
on = true

[nodes.kerosene_cooler]
type = "water_cooler"
ua_kw_per_k = 90.0
water_inlet_c = 30.0
water_flow_kg_per_s = 115.0

[[pipes]]
name = "kerosene_discharge"
from = "kerosene_pump"
