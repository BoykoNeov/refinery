# M19.1 regulation demo: a furnace holding its own OUTLET at 60 °C — the loop a
# refinery operator actually runs on a fired heater, and the first loop in this
# engine whose measurement does not exist at load.
#
#   cool_feed (40 °C) -> heater -> hold_tank -> drain_valve -> rundown
#
# **This file is `tank_temperature_heating.toml` with the loop moved from the
# tank to the heater, and is meant to be diffed against it.** Same feed, same
# furnace, same 2 MW range, same `initial_output`, the tank still starting at
# 40 °C. What differs is the measured node, the tuning, and the names.
#
# **An outlet is not stored anywhere** (docs/DESIGN.md §23). A tank's temperature
# is a field on the graph, exact from load; a furnace outlet is resolved by each
# tick's sweep and does not exist before the first one. So the rule is **no
# measurement, no action**: on tick 1 the loop writes nothing, its faceplate
# tracks the furnace's declared 0.5 MW (u = 0.25), and the snapshot carries no
# `measurement` at all — not a zero, not a stand-in. On tick 2 it measures tick 1's
# outlet, 48.20 °C (48.32 before M36's stack loss), and its PI memory is seeded
# then, against that error, from the declared `initial_output` — so its first
# output is 0.25, exactly as a tank loop's is. The same rule holds the loop still if the flow through the furnace
# ever stops — or did until M34: a furnace with no flow now reports its COIL, a
# state (docs/DESIGN.md §37), so the loop measures and acts on it.
#
# **The tuning was chosen for an outlet with no lag, and the outlet has one now.**
# Settled, the outlet rises 16.64 K per MW (G = 33.28 K per unit of output on this
# 2 MW range). Until M34 it got there on the SAME tick its duty was written, so
# the loop's only dynamics was the one tick it waits to measure, and the gain bound
# was a STABILITY bound, K*G < 1: the tank loop's `gain_per_k = 0.1` (K*G = 3.3)
# swung the outlet between 40 and 73 °C on alternate ticks. This file took 0.015
# (K*G = 0.5) and `integral_time_s = 10.0`. Since M34 the furnace's coil
# (docs/DESIGN.md §37) puts 38.5 s between a firing change and the outlet, and
# that bound is gone: every gain tried up to K*G = 60 settles. The shipped tuning
# peaks at 61.75 °C at tick 103 and is inside 0.1 K of 60 °C from tick 247.
#
# **Holding the outlet is slower for the TANK.** The tank loop overfires the
# furnace (its output peaks at 0.83) to heat the tank faster; an outlet loop
# never does, so the tank follows the 60 °C stream at its own pace — thousands of
# ticks rather than the tank loop's 2 404. That trade-off is what cascade control
# (docs/DEFERRED.md E2) exists for, and M25 built it on this plant:
# `scenarios/furnace_cascade_control.toml` runs this loop inside a tank loop.
#
#   cargo run -p refinery-cli -- run scenarios/furnace_outlet_control.toml --ticks 6000

[meta]
name = "furnace_outlet_control"
description = "A furnace holding its own outlet at 60 °C: the first loop whose measurement does not exist at load."

[simulation]
dt = 1.0

[fidelity]
flow = "newton"     # "newton" (research) | "simple" (game)
thermo = "constant"
reactions = "none"

[nodes.cool_feed]
type = "source"
pressure_bar = 1.6
temperature_c = 40.0

# The actuator. Its declared duty is the loop's starting position: 0.5 MW of a
# 2 MW range is u = 0.25, and `initial_output` below says the same number.
[nodes.heater]
type = "furnace"
duty_mw = 0.5
# Tube coil (docs/DESIGN.md §37): 1 MJ/K per rated MW (its loop's 2 MW range); UA twice
# the load flow's 60.09 kW/K capacity rate; and the coil's steady temperature
# at load, the root of Q·(T_f − T_c)/(T_f − T_a) = G·(T_c − T_in)
# (§40 fork 5; Q = 500 kW, G = 0.8647·60.09 kW/K, T_in = 40 °C), so the plant starts settled.
coil_heat_capacity_mj_per_k = 2
coil_ua_kw_per_k = 120.2
coil_temperature_c = 49.48
# Flame (docs/DESIGN.md §40): methane in air at the stoichiometric ratio,
# 2224.25 K (Marzouk 2023, doi:10.48084/etasr.6132). The duty is what the
# burners release; the coil absorbs (T_f − T_c)/(T_f − 20 °C) of it, 0.985 at load,
# and the rest goes up the stack.
flame_temperature_c = 1951.1

# Not measured: the tank follows the outlet at its own pace. The level is the
# settled 4.968 m, so only the temperature has anywhere to go.
[nodes.hold_tank]
type = "tank"
area_m2 = 3.0
height_m = 10.0
initial_level_m = 4.968
temperature_c = 40.0

[nodes.drain_valve]
type = "valve"
kv = 150.0
opening = 0.5

[nodes.rundown]
type = "sink"
pressure_bar = 1.01325

[[pipes]]
name = "feed_line"
from = "cool_feed"
to = "heater"
length_m = 20.0
diameter_m = 0.10

[[pipes]]
name = "heated_line"
from = "heater"
to = "hold_tank"
length_m = 10.0
diameter_m = 0.10

[[pipes]]
name = "drain_line"
from = "hold_tank"
to = "drain_valve"
length_m = 10.0
diameter_m = 0.15

[[pipes]]
name = "rundown_line"
from = "drain_valve"
to = "rundown"
length_m = 10.0
diameter_m = 0.15

# `initial_output` is the loop's MEMORY, not a bias (docs/DESIGN.md §10 fork 5).
# On an outlet loop it waits: there is no error at load to back-calculate it
# against, so the memory is seeded at the first measurement (tick 2), and the
# first output the loop computes is exactly 0.25 whatever the gain is.
[[controls]]
name = "outlet_temperature"
measurement = { node = "heater", variable = "temperature" }
actuator = "heater"
algorithm = "pi"
mode = "auto"
action = "reverse"
setpoint_c = 60.0
gain_per_k = 0.015
integral_time_s = 10.0
initial_output = 0.25
max_duty_mw = 2.0
