# M62.6 demo plant: the wet crude unit with steam into its column
# (docs/DESIGN.md §67.18, §67.19).
#
# `crude_unit_wet.toml` (M62.5) with stripping steam: a 10 bar, 400 °C
# superheated steam supply, a control valve and a line into the column's
# bottom stage (stage 10, the reboiler):
#
# - THE STEAM RATE is the line's flow, set by the supply and the valve. All
#   vapour, the valve CHOKES (Leung's ω jet, M62.6b): past a drop of about 39 %
#   of its inlet pressure the flow no longer rises as the column's pressure
#   falls. Half open it passes about 0.85 kg/s — a real crude column's 8–10 lb
#   of steam per barrel of residue.
# - THE COLUMN takes the steam on its bottom stage: its water rides up as
#   vapour, every stage it rises through boiling its oil at a lower partial
#   pressure, and leaves the condenser by the water draw with the crude's own
#   water. The steam's heat enters the bottom stage's balance, so the reboiler
#   adds less.
#
# What it still does not have: steam stripping proper (M63) — the reboiler is
# kept here; M63 holds it at zero, so the steam alone strips the residue.
#
# Generated by `tools/steptime/prototypes/m62_6/make_steam.py` from
# `crude_unit_wet.toml`.
