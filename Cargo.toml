[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/solvers",
    "crates/scenarios",
    "crates/cli",
    # M6.2: godot-ext joined the workspace. It was excluded while the reason
    # ("needs a Godot 4 toolchain") applied to the WHOLE crate; it now applies
    # only to the `godot` feature, which is off by default. The translation
    # layer — the half DESIGN §8 calls gateable — is plain Rust and must run
    # under `cargo test --workspace`, or it is a gate nobody invokes.
    "crates/godot-ext",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
refinery-core = { path = "crates/core" }
refinery-solvers = { path = "crates/solvers" }
refinery-scenarios = { path = "crates/scenarios" }

serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: serde_json's DEFAULT float parser is fast, not exact —
# parsing a shortest-representation f64 back can land 1–2 ULP away, so
# `parse(write(x)) != x` for some values. Found in M6.2 by the snapshot
# round-trip gate, which failed on two edge floats. A repo whose first rule
# after "no panics" is bit-identical reruns cannot ship a JSON boundary that
# is quietly lossy. Set at the workspace so every crate parses the same way —
# cargo unifies features per build, so enabling it in one crate would
# otherwise make the behaviour depend on which crates are in the build.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
petgraph = { version = "0.6", features = ["serde-1"] }
faer = "0.20"
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# test/dev
proptest = "1"
approx = "0.5"
criterion = "0.5"

[profile.release]
lto = "thin"

# Property tests and Newton iterations are slow in debug; optimize deps.
[profile.dev.package."*"]
opt-level = 2
