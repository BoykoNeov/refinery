# THE ONLY CRATE ALLOWED TO IMPORT GODOT. If core or solvers ever need a
# change to satisfy this crate, the adapter is wrong — fix it here.
#
# Two halves, split by the `godot` feature (DESIGN §8):
#
#   bridge   — pure Rust, no Godot types, no toolchain. Unit-tested like any
#              other crate; runs under `cargo test --workspace`.
#   binding  — the gdext `RefinerySim` node, behind `--features godot`.
#              Needs a Godot 4 toolchain, so it is OFF by default.
#
#   cargo test --workspace                       # bridge only, no toolchain
#   cargo build -p refinery-godot-ext --features godot --target-dir target/godot
#
# The separate --target-dir is required, not tidiness: `cargo test --workspace`
# rebuilds this crate's cdylib with the feature OFF and would otherwise
# overwrite the library Godot loads with one that has no entry point. See the
# header of refinery.gdextension.

[package]
name = "refinery-godot-ext"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# cdylib for Godot to dlopen; rlib so `tests/` can link the bridge.
crate-type = ["cdylib", "rlib"]

[dependencies]
refinery-core.workspace = true
refinery-scenarios.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The gdext binding. Optional, so a default build has no toolchain
# requirement. `api-4-7` pins the GDExtension API level to the Godot minor
# installed here (4.7) and is the same number `refinery.gdextension` declares
# as `compatibility_minimum` — the two must agree or Godot refuses the library
# with no useful message.
godot = { version = "0.5.5", features = ["api-4-7"], optional = true }

[features]
default = []
godot = ["dep:godot"]
